<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Credential Plate Study | Lencana</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080a0d;
        color: #f6f7f8;
        --gold: #f0b90b;
        --gold-light: #ffe27a;
        --green: #0ecb81;
        --panel: #111419;
        --line: rgba(240, 185, 11, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px),
          radial-gradient(circle at 50% 46%, rgba(240, 185, 11, 0.08), transparent 32rem),
          #080a0d;
        background-size: 44px 44px, 44px 44px, auto, auto;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(1.25rem, 4vw, 4rem);
        isolation: isolate;
      }

      .study {
        width: min(1120px, 100%);
        display: grid;
        gap: clamp(2rem, 5vw, 4rem);
        align-items: center;
      }

      .intro {
        max-width: 46rem;
      }

      .eyebrow,
      .micro,
      .proof-label,
      .proof-value,
      .serial,
      .hint {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--gold);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 6.5rem);
        line-height: 0.92;
        letter-spacing: -0.065em;
        text-wrap: balance;
      }

      .intro-copy {
        max-width: 55ch;
        margin: 1.25rem 0 0;
        color: #9299a5;
        font-size: clamp(0.95rem, 1.6vw, 1.08rem);
        line-height: 1.65;
      }

      .stage {
        --rx: 5deg;
        --ry: -7deg;
        --mx: 50%;
        --my: 38%;
        position: relative;
        display: grid;
        place-items: center;
        min-height: clamp(22rem, 50vw, 38rem);
        perspective: 1200px;
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 12% 8%;
        z-index: -1;
        border: 1px solid rgba(240, 185, 11, 0.12);
        background:
          linear-gradient(90deg, transparent 49.8%, rgba(240, 185, 11, 0.09) 50%, transparent 50.2%),
          linear-gradient(transparent 49.8%, rgba(240, 185, 11, 0.09) 50%, transparent 50.2%);
        clip-path: polygon(0 0, 33% 0, 33% 1px, 67% 1px, 67% 0, 100% 0, 100% 34%, calc(100% - 1px) 34%, calc(100% - 1px) 66%, 100% 66%, 100% 100%, 67% 100%, 67% calc(100% - 1px), 33% calc(100% - 1px), 33% 100%, 0 100%, 0 66%, 1px 66%, 1px 34%, 0 34%);
      }

      .plate-wrap {
        width: min(760px, 92vw);
        aspect-ratio: 1.58;
        transform-style: preserve-3d;
        transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(1deg);
        transition: transform 180ms ease-out;
        will-change: transform;
      }

      .plate {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid rgba(255, 226, 122, 0.52);
        border-radius: clamp(1rem, 2vw, 1.6rem);
        background:
          radial-gradient(circle at var(--mx) var(--my), rgba(255, 255, 255, 0.16), transparent 20%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.055), transparent 32%),
          repeating-linear-gradient(105deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 4px),
          #101318;
        box-shadow:
          0 1px 0 var(--gold-light) inset,
          0 -2px 0 rgba(0, 0, 0, 0.86) inset,
          1.2rem 1.5rem 0 -0.4rem #050607,
          2.8rem 3.4rem 5rem rgba(0, 0, 0, 0.58),
          0 0 4rem rgba(240, 185, 11, 0.08);
        transform-style: preserve-3d;
      }

      .plate::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(110deg, transparent 18%, rgba(255, 234, 158, 0.18) 42%, transparent 58%);
        translate: calc((var(--mx) - 50%) * 0.18) 0;
        mix-blend-mode: screen;
      }

      .plate::after {
        content: "SOULBOUND / PUBLIC PROOF / OPEN BADGES 3.0 / ";
        position: absolute;
        right: 2.7%;
        bottom: 4.5%;
        color: rgba(240, 185, 11, 0.32);
        font: 600 clamp(0.38rem, 0.9vw, 0.62rem)/1 "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.14em;
      }

      .rim {
        position: absolute;
        inset: 3%;
        border: 1px solid rgba(240, 185, 11, 0.22);
        border-radius: calc(clamp(1rem, 2vw, 1.6rem) - 0.3rem);
        pointer-events: none;
      }

      .corner {
        position: absolute;
        width: clamp(0.55rem, 1.4vw, 0.8rem);
        aspect-ratio: 1;
        border: 1px solid rgba(255, 226, 122, 0.75);
        border-radius: 50%;
        background: radial-gradient(circle at 38% 32%, #e6e7e8, #555a62 38%, #121418 72%);
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.4) inset;
      }

      .corner:nth-of-type(1) { top: 5.5%; left: 4%; }
      .corner:nth-of-type(2) { top: 5.5%; right: 4%; }
      .corner:nth-of-type(3) { bottom: 5.5%; left: 4%; }
      .corner:nth-of-type(4) { right: 4%; bottom: 5.5%; }

      .plate-content {
        position: absolute;
        inset: 10% 8%;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: clamp(1rem, 4vw, 3rem);
      }

      .identity {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .micro {
        color: rgba(246, 247, 248, 0.52);
        font-size: clamp(0.46rem, 1vw, 0.66rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand {
        margin: auto 0 0;
        color: var(--gold);
        font-size: clamp(2.3rem, 8vw, 5.7rem);
        font-weight: 950;
        line-height: 0.78;
        letter-spacing: -0.09em;
        text-shadow:
          0 1px 0 var(--gold-light),
          0 3px 0 #9c7400,
          0 7px 12px rgba(0, 0, 0, 0.7);
      }

      .course {
        max-width: 20ch;
        margin: clamp(0.7rem, 2vw, 1.2rem) 0 auto;
        color: #f4f5f6;
        font-size: clamp(0.85rem, 2.2vw, 1.35rem);
        font-weight: 760;
        line-height: 1.1;
        text-transform: uppercase;
      }

      .serial {
        overflow: hidden;
        color: rgba(246, 247, 248, 0.42);
        font-size: clamp(0.42rem, 0.9vw, 0.58rem);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .proofs {
        display: grid;
        align-content: center;
        gap: clamp(0.55rem, 1.5vw, 0.9rem);
      }

      .proof {
        padding: clamp(0.55rem, 1.4vw, 0.9rem);
        border-top: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(240, 185, 11, 0.07), transparent 72%);
      }

      .proof-label {
        display: block;
        margin-bottom: 0.26rem;
        color: rgba(246, 247, 248, 0.46);
        font-size: clamp(0.4rem, 0.85vw, 0.58rem);
        letter-spacing: 0.1em;
      }

      .proof-value {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        color: #f5f6f7;
        font-size: clamp(0.55rem, 1.3vw, 0.82rem);
        font-weight: 700;
      }

      .proof-value.score {
        color: var(--gold-light);
      }

      .proof-value.verified {
        color: var(--green);
      }

      .status-dot {
        width: 0.48rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0.8rem currentColor;
      }

      .seal {
        position: absolute;
        top: 9%;
        left: 51%;
        display: grid;
        width: clamp(2.4rem, 6vw, 4.6rem);
        aspect-ratio: 1;
        place-items: center;
        border: 1px solid rgba(240, 185, 11, 0.6);
        rotate: 45deg;
        background: #0c0f13;
        box-shadow: 0 0 0 4px rgba(240, 185, 11, 0.05), 0 0 1.8rem rgba(240, 185, 11, 0.1);
      }

      .seal::before,
      .seal::after {
        content: "";
        position: absolute;
        background: var(--gold);
      }

      .seal::before {
        width: 44%;
        height: 12%;
      }

      .seal::after {
        width: 12%;
        height: 44%;
      }

      .hint {
        position: absolute;
        right: 0;
        bottom: 2%;
        margin: 0;
        color: rgba(246, 247, 248, 0.44);
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (min-width: 1180px) {
        .study {
          grid-template-columns: minmax(17rem, 0.72fr) minmax(34rem, 1.28fr);
        }
      }

      @media (min-width: 641px) and (max-width: 1179px) {
        .study {
          width: min(820px, 100%);
        }

        .intro {
          max-width: 38rem;
        }

        .stage {
          min-height: 33rem;
        }
      }

      @media (max-width: 640px) {
        main {
          align-items: start;
        }

        .study {
          padding-top: 1.25rem;
        }

        .stage {
          min-height: 22rem;
        }

        .plate-content {
          grid-template-columns: 1fr 0.88fr;
          inset: 11% 8%;
        }

        .proof:nth-child(2) {
          display: none;
        }

        .hint {
          right: 50%;
          translate: 50% 0;
          white-space: nowrap;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .plate-wrap {
          transform: rotateX(2deg) rotateY(-4deg) rotateZ(1deg);
          transition: none;
        }

        .hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="study" aria-labelledby="study-title">
        <header class="intro">
          <p class="eyebrow">Visual study 01 · proof press</p>
          <h1 id="study-title">Proof you can hold.</h1>
          <p class="intro-copy">
            A zero-dependency material study for Lencana: achievement becomes a permanent,
            inspectable credential instead of another floating Web3 decoration.
          </p>
        </header>

        <figure class="stage" aria-label="Obsidian and gold Lencana credential plate visual study">
          <div class="plate-wrap">
            <article class="plate">
              <span class="corner"></span>
              <span class="corner"></span>
              <span class="corner"></span>
              <span class="corner"></span>
              <span class="rim"></span>
              <span class="seal" aria-hidden="true"></span>

              <div class="plate-content">
                <div class="identity">
                  <span class="micro">Verifiable learning credential</span>
                  <strong class="brand">LENCANA</strong>
                  <span class="course">Web3 Foundations · 2026</span>
                  <span class="serial">UID 0x0b95c83b9bd94923...effcb367fa</span>
                </div>

                <div class="proofs">
                  <div class="proof">
                    <span class="proof-label">TASK STATUS</span>
                    <span class="proof-value">COMPLETED</span>
                  </div>
                  <div class="proof">
                    <span class="proof-label">AI EVALUATION</span>
                    <span class="proof-value score">93 / 100 · HONORS</span>
                  </div>
                  <div class="proof">
                    <span class="proof-label">PUBLIC PROOF</span>
                    <span class="proof-value verified"><i class="status-dot"></i> VERIFIED · LOCKED</span>
                  </div>
                </div>
              </div>
            </article>
          </div>
          <figcaption class="hint">Move cursor to inspect material</figcaption>
        </figure>
      </section>
    </main>

    <script>
      const stage = document.querySelector('.stage');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      if (stage && !reducedMotion.matches) {
        let currentX = 5;
        let currentY = -7;
        let targetX = currentX;
        let targetY = currentY;
        let frame = 0;

        const render = () => {
          currentX += (targetX - currentX) * 0.075;
          currentY += (targetY - currentY) * 0.075;
          stage.style.setProperty('--rx', `${currentX.toFixed(2)}deg`);
          stage.style.setProperty('--ry', `${currentY.toFixed(2)}deg`);

          if (Math.abs(targetX - currentX) > 0.01 || Math.abs(targetY - currentY) > 0.01) {
            frame = requestAnimationFrame(render);
          } else {
            frame = 0;
          }
        };

        const update = (event) => {
          const rect = stage.getBoundingClientRect();
          const x = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
          const y = Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
          targetY = (x - 0.5) * 15;
          targetX = (0.5 - y) * 11;
          stage.style.setProperty('--mx', `${(x * 100).toFixed(1)}%`);
          stage.style.setProperty('--my', `${(y * 100).toFixed(1)}%`);
          if (!frame) frame = requestAnimationFrame(render);
        };

        const reset = () => {
          targetX = 5;
          targetY = -7;
          stage.style.setProperty('--mx', '50%');
          stage.style.setProperty('--my', '38%');
          if (!frame) frame = requestAnimationFrame(render);
        };

        stage.addEventListener('pointermove', update, { passive: true });
        stage.addEventListener('pointerleave', reset);
      }
    </script>
  </body>
</html>
