<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sertifikat · spesimen desain</title>
<!-- DESIGN:HEAD — tautan font (Google Fonts) dan <meta> khusus desain. Tanpa skrip eksternal, tanpa gambar eksternal. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300..700&display=swap" rel="stylesheet" crossorigin="anonymous">
<meta name="theme-color" content="#0a1f4a">
<!-- /DESIGN:HEAD -->
<style>
/* ===================== SHARED SHELL — JANGAN UBAH (identik di kelima desain) ===================== */
:root{
  --sheet-w:1122px; --sheet-h:793px;           /* A4 landscape pada 96 dpi, dikurangi sedikit supaya muat satu halaman cetak */
  --scale:1;
  --cx-bg:#e7e8ec; --cx-bar:#15171c; --cx-bar-ink:#e9eaee; --cx-bar-mute:#9aa0ab; --cx-accent:#f0b90b;
}
*{box-sizing:border-box}
html,body{margin:0}
body.cx{background:var(--cx-bg);color:#1b1d22;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.cx-bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--cx-bar);color:var(--cx-bar-ink)}
.cx-bar a{color:var(--cx-bar-ink);text-decoration:none;opacity:.8}
.cx-bar a:hover{opacity:1;text-decoration:underline}
.cx-bar .cx-title{font-weight:650;letter-spacing:.01em}
.cx-bar .cx-title small{display:block;font-weight:400;color:var(--cx-bar-mute);font-size:12px;letter-spacing:0}
.cx-bar .cx-sp{flex:1 1 auto}
.cx-seg{display:inline-flex;border:1px solid #3a3e48;border-radius:8px;overflow:hidden}
.cx-seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--cx-bar-mute)}
.cx-seg button[aria-pressed="true"]{background:var(--cx-accent);color:#15171c;font-weight:600}
.cx-seg button:focus-visible,.cx-btn:focus-visible{outline:2px solid var(--cx-accent);outline-offset:2px}
.cx-btn{all:unset;cursor:pointer;padding:6px 12px;border:1px solid #3a3e48;border-radius:8px;font-size:13px;color:var(--cx-bar-ink)}
.cx-btn:hover{border-color:var(--cx-accent)}
.cx-stage{display:grid;place-items:center;padding:20px 12px 8px}
.cx-fit{position:relative;width:calc(var(--sheet-w) * var(--scale));height:calc(var(--sheet-h) * var(--scale))}
.cx-scale{position:absolute;left:0;top:0;width:var(--sheet-w);height:var(--sheet-h);transform:scale(var(--scale));transform-origin:0 0}   /* satu pemilik transform: skala */
.cx-tilt{width:100%;height:100%;transform:perspective(1800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}   /* satu pemilik transform: miring (interaksi) */
.sheet{position:relative;width:var(--sheet-w);height:var(--sheet-h);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18),0 18px 50px rgba(20,22,30,.28);isolation:isolate}
.cx-foot{max-width:1122px;margin:10px auto 0;padding:0 16px;color:#5b616c;font-size:12.5px}
.cx-foot a{color:#2b4a9a}
.cx-notes{max-width:1122px;margin:18px auto 56px;padding:0 16px}
.cx-notes details{background:#fff;border:1px solid #d6d8de;border-radius:12px;padding:14px 18px}
.cx-notes summary{cursor:pointer;font-weight:650}
.cx-notes dl{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px 18px;margin:14px 0 0}
.cx-notes dt{color:#5b616c}
.cx-notes dd{margin:0}
.cx-notes ul{margin:0;padding-left:18px}
.cx-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
@media (max-width:640px){.cx-notes dl{grid-template-columns:1fr}.cx-notes dt{margin-top:8px}}

/* tampilan alamat ⇄ nama contoh: desain menandai elemen dengan data-show="alamat" atau data-show="nama" */
.sheet[data-mode="alamat"] [data-show="nama"],.sheet[data-mode="nama"] [data-show="alamat"]{display:none !important}

@page{size:297mm 210mm;margin:0}
@media print{
  html,body.cx{background:#fff !important;min-height:0}
  .cx-bar,.cx-foot,.cx-notes{display:none !important}
  .cx-stage{display:block;padding:0;place-items:normal;justify-items:normal;align-items:normal}
  .cx-fit{width:auto;height:auto;position:static;margin:0}
  .cx-scale{position:static;width:auto;height:auto;transform:none !important}
  .cx-tilt{transform:none !important;transition:none !important}
  .sheet{box-shadow:none !important;margin:0;break-inside:avoid;page-break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet,.sheet *{animation:none !important;transition:none !important}   /* cetak = keadaan akhir, bukan separuh jalan */
}
/* ===================== /SHARED SHELL ===================== */

/* ===================== DESIGN CSS ===================== */
/* ATURAN GERAK: keadaan AKHIR adalah gaya bawaan. Semua animasi (masuk dan berkelanjutan) hanya berlaku di bawah `.sheet.is-playing …`,
   dengan animation-fill-mode: both. Tanpa kelas itu (reduce-motion, ?motion=off, cetak) kertas tampil utuh dan diam. */
/* S3 · Kaca Segitiga — Glass / Soft-depth. Lapisan: atmosfer → facet kristal (3 kedalaman) → kaca buram → pelat QR putih padat. */
.sheet{--s3-navy:#0a1f4a;--s3-royal:#2457d6;--s3-cyan:#38c8ee;--s3-violet:#7a6cf0;--s3-base:#f3f7ff;--s3-ink2:#2b3d66;--s3-ink3:#4a5b80;
  --s3-sans:Outfit,"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --s3-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --s3-spring:cubic-bezier(.34,1.56,.64,1);--s3-out:cubic-bezier(.22,1,.36,1);
  background:var(--s3-base);color:var(--s3-navy);font-family:var(--s3-sans)}
.sheet p,.sheet h1,.sheet dl,.sheet dd,.sheet ul{margin:0}
.s3-sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* atmosfer: dasar putih bercahaya + diagonal biru sangat tipis */
.s3-atmo{position:absolute;inset:0;z-index:0;background:
  radial-gradient(900px 660px at 100% 0%,rgba(36,87,214,.17),rgba(36,87,214,0) 62%),
  radial-gradient(520px 420px at 0% 100%,rgba(56,200,238,.20),rgba(56,200,238,0) 66%),
  radial-gradient(720px 540px at 26% 40%,rgba(255,255,255,.96),rgba(255,255,255,0) 70%),
  linear-gradient(135deg,#f8fbff 0%,#f1f6ff 50%,#e8f0ff 100%)}

/* facet: tiga kedalaman, paralaks lewat --mx/--my (hanya transform) */
.s3-fx{position:absolute;left:0;top:0;width:1122px;height:793px;overflow:visible;pointer-events:none;z-index:1;
  transform:translate3d(calc((50% - var(--mx,50%)) * var(--k)),calc((50% - var(--my,50%)) * var(--k)),0);
  transition:transform 1.1s cubic-bezier(.2,.8,.2,1);will-change:transform}
.s3-fx-bl{--k:.012}
.s3-fx-tr{--k:.022}
.s3-fx-front{--k:.042;z-index:2}
.s3-fx .f{transform-box:fill-box;transform-origin:50% 50%}
.s3-fx-g{opacity:.2}

/* kaca */
.s3-glass{background:linear-gradient(140deg,rgba(255,255,255,.76),rgba(255,255,255,.6));
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.62),0 26px 50px -26px rgba(16,52,150,.45),0 3px 10px -4px rgba(10,31,74,.12)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.s3-glass{background:rgba(255,255,255,.9)}}
.s3-sweep{position:absolute;top:-40%;left:0;width:110px;height:180%;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(36,87,214,.1) 30%,rgba(255,255,255,.95) 50%,rgba(56,200,238,.12) 64%,rgba(255,255,255,0));transform:translateX(-170px) rotate(18deg)}
/* cahaya diagonal yang lewat DI BELAKANG kaca: terlihat pada kristal dan menembus kaca buram */
.s3-shine{position:absolute;left:0;top:-320px;width:260px;height:1440px;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.16) 30%,rgba(255,255,255,.5) 50%,rgba(255,255,255,.16) 70%,rgba(255,255,255,0));
  transform:translateX(-420px) rotate(24deg);opacity:0}

/* merek */
.s3-brand{position:absolute;left:72px;top:46px;display:flex;align-items:center;gap:14px;z-index:5}
.s3-tile{position:relative;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(145deg,#3b7cf3 0%,#2457d6 50%,#1a3fae 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.18),0 12px 26px -10px rgba(36,87,214,.7)}
.s3-tile svg{position:relative;z-index:1;width:36px;height:34px;--logo-a:#ffffff;--logo-b:#0a1f4a}
.s3-tile .s3-sweep{--travel:120px;width:36px}
.s3-word{display:flex;flex-direction:column;font-weight:600;font-size:22px;line-height:1.05;letter-spacing:-.01em;color:var(--s3-navy)}
.s3-word small{margin-top:5px;font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--s3-ink3)}

/* judul */
.s3-title{position:absolute;left:66px;top:120px;width:620px;z-index:5;font-weight:700;font-size:80px;line-height:.98;letter-spacing:-.04em;color:var(--s3-navy)}
.s3-title .t1,.s3-title .t2{display:block}
.s3-title .t2{color:var(--s3-royal);padding-bottom:.04em}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .s3-title .t2{background:linear-gradient(100deg,#1b3aa6 0%,#2457d6 45%,#1c7fc4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}}

/* penerima */
.s3-who{position:absolute;left:72px;top:300px;width:620px;z-index:5}
.s3-eyebrow{margin:0 0 8px!important;font-size:14px;font-weight:500;color:var(--s3-ink3);letter-spacing:.01em}
.s3-addr{display:flex;align-items:flex-start;gap:10px;font-family:var(--s3-mono);color:var(--s3-navy)}
.s3-addr .ox{font-size:15px;font-weight:600;color:var(--s3-royal);padding-top:9px}
.s3-addr .g{font-size:30px;font-weight:500;line-height:1.22;width:16.5em;word-spacing:.32em;letter-spacing:0}
.s3-cap{margin-top:8px!important;font-size:12px;color:var(--s3-ink3)}
.s3-name{font-size:58px;font-weight:700;letter-spacing:-.03em;line-height:1.02;color:var(--s3-navy)}
.s3-namesub{margin-top:12px!important;display:flex;align-items:center;gap:12px}
.s3-chip{flex:none;font-family:var(--s3-mono);font-size:13px;font-weight:500;color:var(--s3-navy);padding:5px 11px;border-radius:999px;background:rgba(36,87,214,.08);box-shadow:inset 0 0 0 1px rgba(36,87,214,.2)}
.s3-note{font-size:11.5px;line-height:1.35;color:var(--s3-ink3);max-width:400px}

/* kelas */
.s3-what{position:absolute;left:72px;top:452px;width:600px;z-index:5}
.s3-course{font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--s3-navy)}

/* medali kaca + cincin nilai */
.s3-medal{position:absolute;left:720px;top:82px;width:360px;height:360px;z-index:4}
.s3-medal-par,.s3-medal-float,.s3-medal-in{position:absolute;inset:0}
.s3-medal-par{transform:translate3d(calc((50% - var(--mx,50%)) * .08),calc((50% - var(--my,50%)) * .08),0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.s3-ribbons{position:absolute;left:0;top:0;width:360px;height:470px;overflow:visible}
.s3-pulse{position:absolute;left:14px;top:14px;width:332px;height:332px;border-radius:50%;border:2px solid rgba(56,200,238,.9);box-shadow:0 0 26px rgba(56,200,238,.5);opacity:0;pointer-events:none}
.s3-disc{position:absolute;left:42px;top:42px;width:276px;height:276px;border-radius:50%;overflow:hidden;
  background:radial-gradient(120% 120% at 28% 18%,rgba(255,255,255,.9) 0%,rgba(255,255,255,.64) 44%,rgba(228,239,255,.52) 100%);
  -webkit-backdrop-filter:blur(14px) saturate(175%);backdrop-filter:blur(14px) saturate(175%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.95),inset 0 -18px 38px rgba(36,87,214,.2),0 36px 64px -22px rgba(10,31,74,.6),0 10px 24px -6px rgba(36,87,214,.32)}
.s3-disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(78% 56% at 32% 10%,rgba(255,255,255,.95),rgba(255,255,255,0) 62%),radial-gradient(40% 22% at 70% 92%,rgba(56,200,238,.22),rgba(56,200,238,0) 70%)}
.s3-disc::after{content:"";position:absolute;inset:0;border-radius:50%;padding:1.6px;
  background:conic-gradient(from 200deg,rgba(255,255,255,1),rgba(255,255,255,.15) 22%,rgba(56,200,238,.85) 48%,rgba(255,255,255,.2) 72%,rgba(255,255,255,1));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.s3-disc .s3-sweep{--travel:420px}
.s3-flash{position:absolute;inset:0;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle at 36% 30%,rgba(255,255,255,1),rgba(255,255,255,.4) 58%,rgba(255,255,255,0) 76%)}
.s3-dial{position:absolute;left:0;top:0;width:360px;height:360px;overflow:visible}
.s3-dial .s3-notch,.s3-dial .s3-tick,.s3-dial .s3-pillg{transform-box:fill-box;transform-origin:50% 50%}
.s3-dial .s3-tick{filter:drop-shadow(0 0 5px rgba(56,200,238,.95))}
.s3-dial .s3-arc{filter:drop-shadow(0 0 4px rgba(56,200,238,.85)) drop-shadow(0 0 1px rgba(10,31,74,.35))}
.s3-dial text{font-family:var(--s3-sans);font-size:10.5px;font-weight:600;letter-spacing:.02em;fill:var(--s3-navy)}
.s3-dial .s3-pilltxt{font-size:10.5px;font-weight:600;fill:var(--s3-navy)}
.s3-read{position:absolute;left:80px;top:106px;width:200px;height:148px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.s3-res{font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--s3-ink3)}
.s3-num{display:flex;align-items:flex-start;font-weight:700;font-size:88px;line-height:.92;letter-spacing:-.045em;color:var(--s3-navy);font-variant-numeric:tabular-nums lining-nums;margin-top:2px}
.s3-num small{font-size:15px;font-weight:500;letter-spacing:0;color:var(--s3-ink3);margin:12px 0 0 6px}
.s3-pass{margin-top:10px;padding:4px 12px 4px 15px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.22em;color:#fff;
  background:linear-gradient(135deg,#2a63e6,#1d48bf);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px -6px rgba(36,87,214,.85)}

/* pelat QR: putih padat, tidak pernah di atas kaca */
.s3-qr{position:absolute;left:802px;top:500px;width:196px;z-index:6}
/* padding 20 px dengan radius 20 px: sudut zona tenang 4 modul (≈13,9 px) tetap di dalam pelat putih */
.s3-qrplate{background:#fff;border-radius:20px;padding:20px 20px 14px;transform:translateY(-2px);
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(10,31,74,.07),0 24px 42px -16px rgba(10,31,74,.5),0 6px 14px -6px rgba(36,87,214,.28)}
.s3-qrcode{display:block;width:156px;height:156px;color:var(--s3-navy)}
.s3-scan{margin-top:10px!important;font-size:11px;line-height:1.3;font-weight:500;color:var(--s3-navy)}
.s3-id{margin-top:7px!important;display:flex;flex-direction:column;gap:1px;font-size:10px;color:var(--s3-ink3)}
.s3-id b{font-family:var(--s3-mono);font-weight:500;font-size:10.5px;color:var(--s3-navy);letter-spacing:-.01em}

/* pelat fakta kaca di atas kristal kiri bawah */
.s3-plate{position:absolute;left:48px;top:560px;width:734px;height:214px;border-radius:24px;overflow:hidden;z-index:3}
.s3-plate .s3-sweep{--travel:900px;opacity:.5}
.s3-f{position:absolute}
.s3-f dt{font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--s3-ink3)}
.s3-f dd{margin-top:3px;font-size:16px;font-weight:600;line-height:1.25;color:var(--s3-navy);font-variant-numeric:tabular-nums}
.s3-f-iss{left:26px;top:20px}
.s3-time{margin-left:8px;font-size:13px;font-weight:500;color:var(--s3-ink2)}
.s3-f-val{right:26px;top:20px;text-align:right}
.s3-span{position:absolute;left:266px;right:180px;top:24px;height:36px}
.s3-days{position:absolute;left:0;right:0;top:0;text-align:center;font-size:11px;font-weight:500;color:var(--s3-ink3)}
.s3-rod{position:absolute;left:0;right:0;top:24px;height:6px;border-radius:3px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 calc(100%/12 - 1.5px),rgba(255,255,255,.95) calc(100%/12 - 1.5px) calc(100%/12)),linear-gradient(90deg,var(--s3-royal),#2f8fe2 70%,var(--s3-cyan));
  box-shadow:0 2px 6px -2px rgba(36,87,214,.6)}
.s3-rod::before,.s3-rod::after{content:"";position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%}
.s3-rod::before{left:-6px;background:var(--s3-navy);box-shadow:0 0 0 3px rgba(255,255,255,.95)}
.s3-rod::after{right:-6px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--s3-royal),0 0 0 3px rgba(255,255,255,.95)}
.s3-f-pub{left:26px;top:86px;width:340px}
.s3-f-sig{left:392px;top:86px;width:316px}
.s3-pill{display:table;margin-top:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500;line-height:1.35;color:var(--s3-ink2);background:rgba(10,31,74,.06);box-shadow:inset 0 0 0 1px rgba(10,31,74,.15)}
.s3-proof{display:block;margin-top:3px;font-family:var(--s3-mono);font-size:10.5px;font-weight:500;color:var(--s3-ink2)}
.s3-foot{position:absolute;left:26px;right:26px;bottom:13px;padding-top:9px;border-top:1px solid rgba(10,31,74,.12);font-size:10.5px;line-height:1.42;color:var(--s3-ink2)}

/* ---------- gerak: hanya di bawah .is-playing ---------- */
@keyframes s3-facet{from{opacity:0;transform:scale(.12) rotate(-24deg)}}
@keyframes s3-rise{from{opacity:0;transform:translateY(18px);filter:blur(8px)}}
@keyframes s3-fade{from{opacity:0}}
@keyframes s3-medal{from{transform:scale(.82)}}
@keyframes s3-ribbon{from{opacity:0;transform:translateY(-46px)}}
@keyframes s3-draw{from{stroke-dashoffset:var(--len)}}
@keyframes s3-pop{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.28)}100%{opacity:1;transform:scale(1)}}
@keyframes s3-pulse{0%{opacity:.9;transform:scale(.97)}100%{opacity:0;transform:scale(1.34)}}
@keyframes s3-flash{0%{opacity:0}16%{opacity:.6}100%{opacity:0}}
@keyframes s3-sweep{0%{transform:translateX(-170px) rotate(18deg)}10%,100%{transform:translateX(var(--travel)) rotate(18deg)}}
@keyframes s3-lift{from{transform:translateY(0);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(10,31,74,.07),0 12px 22px -14px rgba(10,31,74,.4),0 3px 8px -6px rgba(36,87,214,.2)}}
@keyframes s3-float{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px)}75%{transform:translateY(4px)}}
@keyframes s3-breathe{0%,100%{opacity:0}50%{opacity:.7}}
@keyframes s3-shine{0%{opacity:1;transform:translateX(-420px) rotate(24deg)}22%{opacity:1;transform:translateX(1420px) rotate(24deg)}22.01%,100%{opacity:0;transform:translateX(1420px) rotate(24deg)}}
.sheet.is-playing .s3-shine{animation:s3-shine 8s cubic-bezier(.4,0,.25,1) 1.03s infinite both}
.sheet.is-playing .s3-fx .f{animation:s3-facet .75s var(--s3-spring) var(--d,0ms) both}
.sheet.is-playing .s3-fx-g{animation:s3-breathe 7s ease-in-out var(--gd,2.6s) infinite both}
.sheet.is-playing .s3-brand{animation:s3-rise .8s var(--s3-out) .12s both}

<script>

    for (let i = 1; i < STOPS.length; i++) if (t <= STOPS[i][0]) return mixc(STOPS[i - 1][1], STOPS[i][1], (t - STOPS[i - 1][0]) / (STOPS[i][0] - STOPS[i - 1][0]));
    return STOPS[STOPS.length - 1][1]; };

  const LIGHT = (() => { const v = [-0.48, -0.7, 0.9], n = Math.hypot(v[0], v[1], v[2]); return v.map((x) => x / n); })();
  const rgb = (c) => 'rgb(' + c.map((v) => Math.max(0, Math.min(255, Math.round(v)))).join(',') + ')';
  const CLUSTERS = [
    { id: 'tr', cx: W, cy: 0, rx: 545, ry: 660, x0: 470, y0: -70, x1: W + 70, y1: 780, cell: 58, seed: 0, hz: 34 },
    { id: 'bl', cx: 0, cy: H, rx: 310, ry: 250, x0: -70, y0: 500, x1: 380, y1: H + 70, cell: 52, seed: 16, hz: 30 }
  ];
  const out = { tr: [], bl: [], front: [], g: [[], [], []] };
  const facet = (o, t, idx) => {
    const cx = (t[0][0] + t[1][0] + t[2][0]) / 3, cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
    const f = Math.hypot((cx - o.cx) / o.rx, (cy - o.cy) / o.ry);
