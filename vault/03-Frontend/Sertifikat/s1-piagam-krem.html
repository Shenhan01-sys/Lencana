<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sertifikat · spesimen desain</title>
<!-- DESIGN:HEAD — tautan font (Google Fonts) dan <meta> khusus desain. Tanpa skrip eksternal, tanpa gambar eksternal. -->
<meta name="description" content="S1 · Piagam Krem — piagam kertas krem dengan pita dan segel kuningan yang ditekan; guilloche turunan hash kredensial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- /DESIGN:HEAD -->
<style>
/* ===================== SHARED SHELL — JANGAN UBAH (identik di kelima desain) ===================== */
:root{
  --sheet-w:1122px; --sheet-h:793px;           /* A4 landscape pada 96 dpi, dikurangi sedikit supaya muat satu halaman cetak */
  --scale:1;
  --cx-bg:#e7e8ec; --cx-bar:#15171c; --cx-bar-ink:#e9eaee; --cx-bar-mute:#9aa0ab; --cx-accent:#f0b90b;
}
*{box-sizing:border-box}
html,body{margin:0}
body.cx{background:var(--cx-bg);color:#1b1d22;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.cx-bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--cx-bar);color:var(--cx-bar-ink)}
.cx-bar a{color:var(--cx-bar-ink);text-decoration:none;opacity:.8}
.cx-bar a:hover{opacity:1;text-decoration:underline}
.cx-bar .cx-title{font-weight:650;letter-spacing:.01em}
.cx-bar .cx-title small{display:block;font-weight:400;color:var(--cx-bar-mute);font-size:12px;letter-spacing:0}
.cx-bar .cx-sp{flex:1 1 auto}
.cx-seg{display:inline-flex;border:1px solid #3a3e48;border-radius:8px;overflow:hidden}
.cx-seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--cx-bar-mute)}
.cx-seg button[aria-pressed="true"]{background:var(--cx-accent);color:#15171c;font-weight:600}
.cx-seg button:focus-visible,.cx-btn:focus-visible{outline:2px solid var(--cx-accent);outline-offset:2px}
.cx-btn{all:unset;cursor:pointer;padding:6px 12px;border:1px solid #3a3e48;border-radius:8px;font-size:13px;color:var(--cx-bar-ink)}
.cx-btn:hover{border-color:var(--cx-accent)}
.cx-stage{display:grid;place-items:center;padding:20px 12px 8px}
.cx-fit{position:relative;width:calc(var(--sheet-w) * var(--scale));height:calc(var(--sheet-h) * var(--scale))}
.cx-scale{position:absolute;left:0;top:0;width:var(--sheet-w);height:var(--sheet-h);transform:scale(var(--scale));transform-origin:0 0}   /* satu pemilik transform: skala */
.cx-tilt{width:100%;height:100%;transform:perspective(1800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}   /* satu pemilik transform: miring (interaksi) */
.sheet{position:relative;width:var(--sheet-w);height:var(--sheet-h);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18),0 18px 50px rgba(20,22,30,.28);isolation:isolate}
.cx-foot{max-width:1122px;margin:10px auto 0;padding:0 16px;color:#5b616c;font-size:12.5px}
.cx-foot a{color:#2b4a9a}
.cx-notes{max-width:1122px;margin:18px auto 56px;padding:0 16px}
.cx-notes details{background:#fff;border:1px solid #d6d8de;border-radius:12px;padding:14px 18px}
.cx-notes summary{cursor:pointer;font-weight:650}
.cx-notes dl{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px 18px;margin:14px 0 0}
.cx-notes dt{color:#5b616c}
.cx-notes dd{margin:0}
.cx-notes ul{margin:0;padding-left:18px}
.cx-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
@media (max-width:640px){.cx-notes dl{grid-template-columns:1fr}.cx-notes dt{margin-top:8px}}

/* tampilan alamat ⇄ nama contoh: desain menandai elemen dengan data-show="alamat" atau data-show="nama" */
.sheet[data-mode="alamat"] [data-show="nama"],.sheet[data-mode="nama"] [data-show="alamat"]{display:none !important}

@page{size:297mm 210mm;margin:0}
@media print{
  html,body.cx{background:#fff !important;min-height:0}
  .cx-bar,.cx-foot,.cx-notes{display:none !important}
  .cx-stage{display:block;padding:0;place-items:normal;justify-items:normal;align-items:normal}
  .cx-fit{width:auto;height:auto;position:static;margin:0}
  .cx-scale{position:static;width:auto;height:auto;transform:none !important}
  .cx-tilt{transform:none !important;transition:none !important}
  .sheet{box-shadow:none !important;margin:0;break-inside:avoid;page-break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet,.sheet *{animation:none !important;transition:none !important}   /* cetak = keadaan akhir, bukan separuh jalan */
}
/* ===================== /SHARED SHELL ===================== */

/* ===================== DESIGN CSS ===================== */
/* ATURAN GERAK: keadaan AKHIR adalah gaya bawaan. Semua animasi (masuk dan berkelanjutan) hanya berlaku di bawah `.sheet.is-playing …`,
   dengan animation-fill-mode: both. Tanpa kelas itu (reduce-motion, ?motion=off, cetak) kertas tampil utuh dan diam. */
/* ---- S1 · Piagam Krem — token ---- */
.sheet{--paper:#f4ecd8;--paper-2:#efe6cf;--ink:#1f3a36;--ink-2:#2f4a45;--ink-mute:#33463f;--brass-hi:#e3c878;--brass:#b08d3c;--brass-lo:#7a5c1e;--stamp:#8a3a2c;
  --f-display:'Cinzel','Trajan Pro','Cormorant SC',Georgia,'Times New Roman',serif;
  --f-body:'Cormorant Garamond','Cormorant','EB Garamond',Garamond,Georgia,'Times New Roman',serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
  background:var(--paper);color:var(--ink);font-family:var(--f-body);font-kerning:normal;text-rendering:optimizeLegibility}
.sheet p,.sheet dl,.sheet dd,.sheet dt,.sheet h1,.sheet ul{margin:0}
@media screen{.sheet.s1-wait{opacity:0}}

/* ---- kertas: dasar, potongan periksa, serat, cahaya kiri-atas, lipatan perforasi ---- */
.s1-layer{position:absolute;left:0;top:0;pointer-events:none}
.s1-paper{width:1122px;height:793px;z-index:0;background:linear-gradient(162deg,#f7f0de 0%,#f3ead5 38%,#efe6cf 72%,#e9dec3 100%)}
.s1-stub-bg{left:892px;width:230px;height:793px;z-index:0;background:linear-gradient(172deg,#fbf7ec 0%,#f6f0e1 100%)}
.s1-art{z-index:1;overflow:visible}
.s1-grain{z-index:2}
.s1-light{width:1122px;height:793px;z-index:2;background:radial-gradient(115% 85% at 6% -4%,rgba(255,252,242,.6) 0%,rgba(255,252,242,0) 50%),radial-gradient(150% 120% at 46% 42%,rgba(0,0,0,0) 58%,rgba(104,78,36,.12) 100%)}
.s1-crease{left:878px;width:28px;height:793px;z-index:1;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(118,90,46,.08) 46%,rgba(255,255,255,.5) 54%,rgba(255,255,255,0) 100%)}

/* ---- garis cetak (SVG) ---- */
.s1-fr{fill:none;stroke:var(--ink-2)}
.s1-fr-a{stroke-width:1.1}
.s1-fr-b{stroke-width:.55}
.s1-wv{fill:none;stroke:var(--ink-2);stroke-width:.42;stroke-opacity:.66}
.s1-wv2{stroke-opacity:.42}
.s1-crn circle{fill:none;stroke:var(--ink-2);stroke-width:.6}
.s1-crn path{fill:none;stroke:var(--ink-2);stroke-width:.42;stroke-opacity:.8}
.s1-crn .s1-dot{fill:var(--ink-2);stroke:none}
.s1-und{fill:none;stroke:var(--ink-2);stroke-width:.5;stroke-opacity:.09}
.s1-mt{font-family:var(--f-mono);font-size:4.2px;font-weight:500;fill:var(--ink-2);fill-opacity:.85}
.s1-micro-ros{fill:none;stroke:var(--brass-lo);stroke-width:.4}
.s1-perf-hole{fill:#c9bb98}
.s1-perf-rim{fill:#fffdf5;fill-opacity:.85}

/* ---- pita ---- */
.s1-ribbon{z-index:3;overflow:visible}
.s1-rib-main,.s1-tail-drop,.s1-tail-sway{transform-box:fill-box;transform-origin:50% 0}

/* ---- segel ---- */
.s1-seal-pos{position:absolute;left:61px;top:175px;width:250px;height:250px;z-index:5}
.s1-seal-shadow{position:absolute;left:0;top:0;width:250px;height:250px;overflow:visible;pointer-events:none}
.s1-seal-ring{position:absolute;left:5px;top:5px;width:240px;height:240px;border-radius:50%;border:2px solid rgba(176,141,60,.75);box-shadow:inset 0 0 0 1px rgba(255,248,220,.55);opacity:0;pointer-events:none}
.s1-seal-btn{position:absolute;left:0;top:0;width:250px;height:250px;padding:0;margin:0;border:0;background:none;border-radius:50%;cursor:pointer;color:inherit;font:inherit;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
.s1-seal-btn:focus{outline:none}
.s1-seal-btn:focus-visible{outline:2px solid var(--ink);outline-offset:-1px}
.s1-seal-press{display:block;width:250px;height:250px;transition:transform .18s cubic-bezier(.3,.7,.4,1)}
.s1-seal-btn:active .s1-seal-press{transform:scale(.972)}
.s1-seal-stamp{display:block;position:relative;width:250px;height:250px}
.s1-seal-art{display:block;width:250px;height:250px;overflow:visible}
.s1-spec,.s1-sheen-clip{position:absolute;left:13px;top:13px;width:224px;height:224px;border-radius:50%;pointer-events:none}
.s1-spec{--hx:clamp(-10%,calc(30% + (var(--mx,50%) - 50%) * 1.3),110%);--hy:clamp(-10%,calc(24% + (var(--my,50%) - 50%) * 1.3),110%);background:radial-gradient(circle at var(--hx) var(--hy),rgba(255,251,232,.6) 0,rgba(255,251,232,.22) 16%,rgba(255,251,232,0) 44%)}
.s1-sheen-clip{overflow:hidden}
.s1-sheen{position:absolute;left:0;top:-10%;width:100%;height:120%;background:linear-gradient(102deg,rgba(255,250,226,0) 32%,rgba(255,250,226,.36) 46%,rgba(255,255,250,.72) 50%,rgba(255,250,226,.36) 54%,rgba(255,250,226,0) 68%);transform:translateX(-125%)}
.s1-reed{fill:none;stroke:#5a4214;stroke-opacity:.3;stroke-width:.55}
.s1-tk-track{fill:none;stroke:#7a5c1e;stroke-opacity:.42;stroke-width:.7}
.s1-tk{stroke:#3e2c0b;stroke-width:1.25;stroke-linecap:round}
.s1-notch{fill:var(--ink);stroke:#0d211e;stroke-width:.5}
.s1-notch-hl{fill:none;stroke:#fff3c8;stroke-opacity:.8;stroke-width:.6}
.s1-notch-l{stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
.s1-bead{fill:url(#s1-g-bead);stroke:#4a3510;stroke-width:.6;transform-box:fill-box;transform-origin:center}
.s1-ros{fill:none;stroke:#5e4415;stroke-width:.42;stroke-opacity:.66}
.s1-ros2{stroke-opacity:.42}
.s1-turn{fill:none;stroke:#7a5c1e;stroke-opacity:.15;stroke-width:.45}
.s1-star{fill:#5a4113}
.s1-rt{font-family:var(--f-display);font-size:10.5px;font-weight:700;letter-spacing:.24em}
.s1-rt-b{font-size:10px;letter-spacing:.13em}
.s1-num{font-family:var(--f-body);font-size:46px;font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.s1-med-lbl{font-family:var(--f-display);font-size:10px;font-weight:700;letter-spacing:.28em}
.s1-med-sub{font-family:var(--f-body);font-size:12.5px;font-style:italic;font-weight:600}
.s1-emb .hl{fill:#fff8dc;fill-opacity:.9}
.s1-emb .sh{fill:#3a2806;fill-opacity:.5}
.s1-emb .mn{fill:#46330c}

/* ---- nomor seri ---- */
.s1-serial{position:absolute;right:286px;top:56px;z-index:4;font:500 11.5px/1 var(--f-mono);color:var(--stamp);letter-spacing:.05em;font-variant-numeric:tabular-nums;white-space:nowrap}
.s1-serial span:first-child{font:700 10.5px/1 var(--f-display);letter-spacing:.12em;margin-right:6px}

/* ---- blok teks utama ---- */
.s1-body{position:absolute;left:330px;top:74px;width:516px;text-align:center;z-index:4}
.s1-title{font:600 31px/1 var(--f-display);letter-spacing:.12em;padding-left:.12em;text-transform:uppercase;color:var(--ink);text-shadow:-.5px -.5px 0 rgba(255,255,255,.65),.6px .8px .4px rgba(31,58,54,.22)}
.s1-micro{display:block;width:420px;height:12px;margin:11px auto 0;overflow:visible}
.s1-title-en{font:italic 600 16px/1.2 var(--f-body);letter-spacing:.06em;color:var(--ink-2);margin-top:5px}
.s1-kicker{font:italic 500 19px/1.15 var(--f-body);color:var(--ink-2)}
.s1-recip{margin-top:24px}
.s1-who{height:78px;display:flex;align-items:center;justify-content:center;margin-top:6px}
.s1-addrbox{position:relative;display:inline-block}
.s1-0x{position:absolute;right:100%;top:8px;margin-right:9px;font:500 13px/1 var(--f-mono);color:var(--ink-2);letter-spacing:.02em}
.s1-addr{display:block;width:26ch;font:500 24px/34px var(--f-mono);color:var(--ink);word-spacing:.22em;text-align:left;font-variant-ligatures:none}
.s1-g{display:inline-block;word-spacing:normal}
.s1-g:nth-child(even){color:#3e5c55}
.s1-name{font:italic 600 54px/1 var(--f-body);color:var(--ink);text-shadow:-.5px -.5px 0 rgba(255,255,255,.6)}
.s1-rule{display:block;width:440px;height:8px;margin:4px auto 0;overflow:visible}
.s1-rule path{fill:none;stroke:var(--ink-2);stroke-width:.8}
.s1-rule .s1-dia{fill:var(--brass);stroke:var(--brass-lo);stroke-width:.5}
.s1-under{height:34px;margin-top:6px}
.s1-under-lbl{font:700 10.5px/1.3 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.s1-addr-short{display:block;font:500 13px/1.3 var(--f-mono);color:var(--ink)}
.s1-name-note{display:block;font:italic 600 13px/1.3 var(--f-body);color:var(--ink-2)}
.s1-course{margin-top:14px}
.s1-course-title{font:600 28px/1.12 var(--f-body);color:var(--ink);margin:4px auto 0;max-width:500px;text-wrap:balance}
.s1-result{margin-top:18px}
.s1-verdict{display:flex;align-items:center;justify-content:center;gap:14px}
.s1-lulus{font:700 15px/1 var(--f-display);letter-spacing:.34em;padding:6px 6px 5px calc(.34em + 6px);color:var(--ink);border:1.25px solid var(--ink);box-shadow:inset 0 0 0 2.5px rgba(244,236,216,.9),inset 0 0 0 3.25px var(--ink-2)}
.s1-scoreline{font:italic 600 17px/1.2 var(--f-body);color:var(--ink-2);font-variant-numeric:lining-nums tabular-nums}
.s1-pips{list-style:none;padding:0;margin-top:14px;display:flex;justify-content:center;gap:24px}
.s1-pips li{display:flex;align-items:center;gap:7px;text-align:left}
.s1-pip{width:46px;height:46px;flex:none;overflow:visible}
.s1-pip-track{fill:none;stroke:var(--ink-2);stroke-opacity:.18;stroke-width:2.4}
.s1-pipa{fill:none;stroke:var(--ink);stroke-width:2.4}
.s1-pipd{transform-box:fill-box;transform-origin:center}
.s1-pip-t{display:block;font:600 15px/1.1 var(--f-body);color:var(--ink)}
.s1-pip-t b{font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.s1-pip-w{display:block;font:italic 600 13.5px/1.2 var(--f-body);color:var(--ink-2);font-variant-numeric:lining-nums tabular-nums}

/* ---- pita bawah: penerbit · tanda tangan · tanggal ---- */
.s1-band{position:absolute;left:64px;top:562px;width:740px;display:grid;grid-template-columns:220px 282px 1fr;column-gap:26px;align-items:start;z-index:4}
.s1-cell dt{font:700 10px/1.25 var(--f-display);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2)}
.s1-pub-name{display:block;font:600 18px/1.15 var(--f-body);color:var(--ink);margin-top:6px}
.s1-pub-note{display:block;font:italic 600 14px/1.3 var(--f-body);color:var(--ink-2);margin-top:3px}
.s1-sig-name{display:block;font:italic 600 23px/1.1 var(--f-body);color:var(--ink);margin-top:8px}
.s1-sig-line{display:block;height:1px;margin:7px 0 6px;background:linear-gradient(90deg,var(--ink-2),var(--ink-2) 78%,rgba(47,74,69,0))}
.s1-proof{display:block;font:500 10.5px/1.35 var(--f-mono);color:var(--ink-2)}
.s1-dates{display:grid;row-gap:9px}
.s1-date{display:inline-block;margin-top:4px;font:600 17px/1.15 var(--f-body);color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.s1-time{margin-left:6px;font:600 13px/1 var(--f-body);color:var(--ink-2);font-variant-numeric:lining-nums tabular-nums}
.s1-valid{display:block;width:180px;height:16px;margin-top:5px;overflow:visible}
.s1-vl{fill:none;stroke:var(--ink-2);stroke-width:.8}
.s1-vmark{fill:var(--stamp)}

/* ---- kaki ---- */
.s1-foot{position:absolute;left:64px;top:700px;width:782px;text-align:center;z-index:4}
.s1-limit{font:italic 600 14px/1.25 var(--f-body);color:var(--ink)}
.s1-demo{margin-top:5px;font:700 10.5px/1.2 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}

/* ---- potongan periksa (stub) ---- */
.s1-stubc{position:absolute;left:892px;top:0;width:230px;height:793px;padding:36px 22px 0;text-align:center;z-index:4}
.s1-brand{display:flex;align-items:center;justify-content:center;gap:8px}
.s1-logo{display:block;width:26px;height:24px;--logo-a:#b08d3c;--logo-b:#1f3a36}
.s1-wordmark{font:700 12.5px/1 var(--f-display);letter-spacing:.34em;padding-left:.34em;color:var(--ink)}
.s1-idl{margin-top:16px}
.s1-idl dt,.s1-chain dt{font:700 10px/1.25 var(--f-display);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2)}
.s1-idl dd{margin-top:3px;font:500 12.5px/1.2 var(--f-mono);color:var(--stamp);letter-spacing:.03em}
.s1-plate{width:182px;height:182px;margin:14px auto 0;padding:14px;background:#fffdf7;border:1px solid rgba(31,58,54,.38);box-shadow:0 1px 0 rgba(255,255,255,.8),0 2px 6px -3px rgba(60,45,20,.25)}
.s1-qr{display:block;width:152px;height:152px;color:#13211f}
.s1-host{margin-top:10px;font:500 12px/1.2 var(--f-mono);color:var(--ink);letter-spacing:.01em}
.s1-scan{margin-top:5px;font:italic 600 13.5px/1.25 var(--f-body);color:var(--ink)}
.s1-chain{margin-top:16px;padding-top:12px;border-top:1px solid rgba(31,58,54,.3);text-align:left;display:grid;row-gap:8px}
.s1-chain dd{margin-top:2px;font:500 11.5px/1.2 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.s1-onchain{margin-top:12px;text-align:left;font:italic 600 13.5px/1.25 var(--f-body);color:var(--ink)}
.s1-status-note{position:absolute;left:22px;right:22px;bottom:34px;text-align:left;font:italic 600 13.5px/1.25 var(--f-body);color:var(--ink)}

/* ---- cap status bertanggal (melintasi perforasi) ---- */
.s1-stamp-pos{position:absolute;left:806px;top:588px;width:178px;height:80px;z-index:6;pointer-events:none}
.s1-stamp{width:178px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px double var(--stamp);border-radius:10px;color:var(--stamp);transform:rotate(-7deg);filter:url(#s1-f-ink);opacity:.93}
.s1-stamp-main{font:700 25px/1 var(--f-display);letter-spacing:.14em;padding-left:.14em}
.s1-stamp-sub{margin-top:7px;font:700 10.5px/1 var(--f-display);letter-spacing:.1em}

/* ---- GERAK — semua di bawah .sheet.is-playing; keadaan akhir = gaya bawaan di atas ---- */
@keyframes s1-settle{from{opacity:0;transform:translate3d(0,-12px,0) rotate(-.45deg) scale(1.01)}to{opacity:1;transform:none}}
@keyframes s1-fade{from{opacity:0}to{opacity:1}}
@keyframes s1-rise{from{opacity:0;transform:translate3d(0,7px,0)}to{opacity:1;transform:none}}
@keyframes s1-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes s1-unroll{from{transform:scaleY(0)}to{transform:scaleY(1)}}

  [[BC, BC], [W - BC, BC], [W - BC, HH - BC], [BC, HH - BC]].forEach(([cx, cy], ci) => {
    mk('circle', { cx, cy, r: RR }, crn); mk('circle', { cx, cy, r: RR - 2.6 }, crn);
    const ph = B(20 + ci) / 255 * TAU;
    for (let k = 0; k < 7; k++) draw(mk('path', { d: polar((t) => 12.6 + 7.4 * Math.sin(G.crnN * t + ph + k * TAU / 7), cx, cy, 200) }, crn), 0.5 + ci * 0.1 + k * 0.035, 1.1);
    mk('circle', { cx, cy, r: 1.8, class: 's1-dot' }, crn);
  });
  const mtg = mk('g', null, art);
  [[780, 'translate(56 49.6)'], [681, 'translate(842.4 56) rotate(90)'], [780, 'translate(836 743.4) rotate(180)'], [681, 'translate(49.6 737) rotate(-90)']].forEach(([len, tr]) => {
    mk('text', { class: 's1-mt', transform: tr, textLength: len, lengthAdjust: 'spacing' }, mtg).textContent = microText(len, 4.2);
  });
  /* roset latar (underprint) di belakang blok teks */
  const und = q('#s1-und'), ux0 = 588, uy0 = 318;
  for (let k = 0; k < 12; k++) draw(mk('path', { d: polar((t) => 152 + 60 * Math.sin(G.undN * t + k * TAU / 12), ux0, uy0, 900), class: 's1-und' }, und), 0.35 + k * 0.05, 2.2);
  for (let k = 0; k < 8; k++) draw(mk('path', { d: polar((t) => 152 + 38 * Math.sin(G.undM * t - k * TAU / 8 + G.wvPh), ux0, uy0, 900), class: 's1-und' }, und), 0.6 + k * 0.05, 2.2);
  /* perforasi potongan periksa */
  const perf = q('#s1-perf');
  for (let y = 8; y < 790; y += 9) { mk('circle', { cx: 892.6, cy: y + 0.7, r: 2.1, class: 's1-perf-rim' }, perf); mk('circle', { cx: 892, cy: y, r: 2, class: 's1-perf-hole' }, perf); }
  /* garis mikroteks di bawah judul */
  const mic = q('.s1-micro');
  [[0, 188], [232, 188]].forEach(([x, len]) => { mk('text', { x, y: 7.4, class: 's1-mt', textLength: len, lengthAdjust: 'spacing' }, mic).textContent = microText(len, 4.2); mk('path', { d: `M${x} 10.2H${x + len}`, class: 's1-fr s1-fr-b' }, mic); });
  for (let k = 0; k < 5; k++) mk('path', { d: polar((t) => 3.6 + 2.2 * Math.sin(G.crnN * t + k * TAU / 5), 210, 6, 90), class: 's1-micro-ros' }, mic);

  /* ---- 3. segel: gerigi (hash) → cincin ukur (nilai) → legenda → roset (hash) → medali (angka) ---- */
  const N = G.scallops, ph0 = G.scPhase * TAU / N, RV = 112, rho = 2 * RV * Math.sin(Math.PI / N) * 0.6;
  let sd = '';
  for (let i = 0; i <= N; i++) { const t = ph0 + i * TAU / N; sd += (i ? `A${r2(rho)} ${r2(rho)} 0 0 1 ` : 'M') + P(RV * Math.sin(t), -RV * Math.cos(t)); }
  q('#s1-scallop').setAttribute('d', sd + 'Z');
  let rd = '';
  for (let i = 0; i < 180; i++) { const t = i / 180 * TAU, s = Math.sin(t), c = Math.cos(t); rd += `M${P(104.6 * s, -104.6 * c)}L${P(110.2 * s, -110.2 * c)}`; }
  mk('path', { d: rd, class: 's1-reed' }, q('#s1-reed'));
  const gauge = q('#s1-gauge');
  let td = '';
  for (let k = 1; k <= 100; k++) { const t = (k - 0.5) / 100 * TAU, s = Math.sin(t), c = Math.cos(t), r0 = k % 10 ? 94.5 : 91.5; td += `M${P(r0 * s, -r0 * c)}L${P(100.6 * s, -100.6 * c)}`; }
  mk('path', { d: td, class: 's1-tk-track' }, gauge);
  const easeInv = (y) => 1 - Math.cbrt(1 - y);   // kebalikan easeOutCubic milik countUp → garis menyala selaras angka
  for (let k = 1; k <= C.score; k++) {
    const t = (k - 0.5) / 100 * TAU, s = Math.sin(t), c = Math.cos(t), r0 = k % 10 ? 92.6 : 89.6;

  }

  for (let k = 0; k < 6; k++) mk('path', { d: polar((t) => 57.6 + 9.4 * (0.6 * Math.sin(G.rosB * t - k * TAU / 6) + 0.4 * Math.sin((G.rosB - G.rosA) * t + k * TAU / 6 + G.rosPh)), 0, 0, 900), class: 's1-ros s1-ros2' }, ros);

  q('.s1-seal-btn').setAttribute('aria-label', `Segel kredensial: nilai akhir ${C.score} dari 100, batas lulus ${C.passMark}. Tekan untuk mengulang cap.`);

  /* ---- 4. pip komponen: luas cakram ∝ bobot, busur email = skor komponen ---- */
  const ul = q('.s1-pips');
  C.components.forEach((c, i) => {

    arc.style.setProperty('--v', c.score); arc.style.setProperty('--dl', (2.0 + i * 0.14).toFixed(2) + 's');
    const g = mk('g', { class: 's1-pipd' }, sv); g.style.setProperty('--dl', (1.9 + i * 0.14).toFixed(2) + 's');
    mk('circle', { r: r2(rad), fill: 'url(#s1-g-medal)' }, g);
    mk('circle', { r: r2(rad), fill: 'none', stroke: 'url(#s1-g-edge-hi)', 'stroke-width': 1.1 }, g);
    mk('circle', { r: r2(Math.max(rad - 2.3, 2)), fill: 'none', stroke: 'url(#s1-g-edge-lo)', 'stroke-width': 0.8 }, g);
    li.append(sv);
    const tx = document.createElement('span'), t1 = document.createElement('span'), b = document.createElement('b'), t2 = document.createElement('span');
    t1.className = 's1-pip-t'; t1.append(`${T[c.key]} `); b.textContent = String(c.score); t1.append(b);
    t2.className = 's1-pip-w'; t2.textContent = `bobot ${c.weight}%`;
    tx.append(t1, t2); li.append(tx); ul.append(li);
  });

  /* ---- 5. penggaris masa berlaku: ruas bulan, segitiga = hari status dibaca ---- */
  const months = Math.max(1, Math.round(C.validDays / 30.44)), vs = q('.s1-valid');
  let vd = 'M3 8H177';
  for (let m = 0; m <= months; m++) { const x = 3 + m / months * 174, h = (m === 0 || m === months) ? 5 : (m % 3 ? 2 : 3.4); vd += `M${r2(x)} ${r2(8 - h)}V${r2(8 + h)}`; }
  mk('path', { d: vd, class: 's1-vl' }, vs);
  const t0 = Date.parse(C.issuedAt), t1v = Date.parse(C.validUntil), tr = Date.parse(C.statusReadOn + 'T00:00:00Z');
  const fx = 3 + Math.min(1, Math.max(0, (tr - t0) / (t1v - t0))) * 174;
  mk('path', { d: `M${r2(fx - 3.4)} -1.5L${r2(fx + 3.4)} -1.5L${r2(fx)} 3.6Z`, class: 's1-vmark' }, vs);

  /* ---- 6. alamat dikelompokkan per 4 (dua baris × 5 kelompok), warna berselang ---- */
  const addr = q('.s1-addr');
  if (addr) { addr.removeAttribute('data-bind'); addr.textContent = ''; F.addressGroups().split(' ').forEach((g, i, a) => { const s = document.createElement('span'); s.className = 's1-g'; s.style.setProperty('--i', i); s.textContent = g; addr.append(s); if (i < a.length - 1) addr.append(' '); }); }

  /* ---- 7. gerak: hitung-naik angka (selaras garis ukur), cap ulang saat segel ditekan ---- */
  let gen = 0;
  const setNum = (v) => numEls.forEach((e) => { e.textContent = v; });
  const count = (delay, ms) => { const my = ++gen; setNum('0'); setTimeout(() => { if (my !== gen) return; numEls.forEach((e) => window.countUp(e, C.score, { ms, fmt: (v) => (my === gen ? String(Math.round(v)) : e.textContent) })); }, delay); };
  /* ganti mode alamat ⇄ nama sesudah masuk: elemen mode tampil seketika (catatan nama + alamat pendek ikut bersama nama) */
  document.querySelectorAll('[data-mode-btn]').forEach((b) => b.addEventListener('click', () => sheet.classList.add('s1-moded')));
  document.addEventListener('cx:play', (e) => {
    sheet.classList.remove('s1-wait', 's1-moded');
    if (e.detail && e.detail.reduced) { gen++; setNum(F.score()); return; }
    count(1550, COUNT_MS);
  });
  const btn = q('.s1-seal-btn'), stampEl = q('.s1-seal-stamp'), shEl = q('.s1-seal-shadow'), ringEl = q('.s1-seal-ring');
  const reducedNow = () => matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]motion=off/.test(location.search);
  btn.addEventListener('click', () => {
    if (reducedNow() || !stampEl.animate) return;
    const D = 640;
    stampEl.animate([
      { transform: 'none', offset: 0, easing: 'cubic-bezier(.2,.7,.3,1)' },
      { transform: 'scale(1.16) rotate(-2.5deg)', offset: 0.32, easing: 'cubic-bezier(.6,0,.9,.4)' },

      { transform: 'scale(1.014)', offset: 0.8, easing: 'ease-out' },
      { transform: 'none', offset: 1 }], { duration: D });
    shEl.animate([
      { transform: 'none', opacity: 1, offset: 0, easing: 'cubic-bezier(.2,.7,.3,1)' },
      { transform: 'translate(12px,18px) scale(1.14)', opacity: 0.45, offset: 0.32, easing: 'cubic-bezier(.6,0,.9,.4)' },
      { transform: 'translate(-1px,-2px) scale(.97)', opacity: 1, offset: 0.6, easing: 'ease-out' },
      { transform: 'none', opacity: 1, offset: 1 }], { duration: D });
    ringEl.animate([{ opacity: 0.8, transform: 'scale(.94)' }, { opacity: 0, transform: 'scale(1.34)' }], { duration: 700, delay: D * 0.6, easing: 'cubic-bezier(.2,.7,.3,1)' });
  });

  /* ---- 8. catatan desain ---- */
  const ws = C.components.map((c) => `${T[c.key]} ${c.weight}%`).join(' · '), ss = C.components.map((c) => `${T[c.key]} ${c.score}`).join(' · ');
  window.DESIGN = {
    id: 'S1', name: 'Piagam Krem',
    row: 'Skeuomorfik / taktil — piagam kertas dengan segel tekan',

      metaphor: 'Segel yang ditekan = komitmen pada kredensial persis ini. Gerigi segel, roset, bingkai bergelombang, roset sudut, dan roset latar diturunkan dari byte hash; kredensial lain mencetak pola lain.'
    },
    encodes: [
      `Cincin ukur segel: 100 garis, ${C.score} terisi = nilai akhir; takik email hijau-batu di ${C.passMark} = batas lulus; manik kuningan di ujung isian.`,
      'Angka besar di medali segel = nilai akhir (hitung naik selaras garis ukur yang menyala).',
      `Tiga pip kuningan: luas cakram ∝ bobot (${ws}); busur di sekelilingnya = skor komponen (${ss}).`,
      `Gerigi tepi segel: ${G.scallops} lekuk (30 + byte 0 mod 9), fase dari byte 1 hash.`,
      `Roset segel: dua keluarga gelombang, ${G.rosA} dan ${G.rosB} lekuk (byte 2, 3, 16).`,
      `Bingkai: ${G.strands} helai × 2 keluarga gelombang, periode ${G.lam1} px dan ${G.lam2} px (byte 4, 5, 6, 9); roset sudut ${G.crnN} kelopak (byte 7, 20–23); roset latar ${G.undN}/${G.undM} lekuk (byte 12–13).`,
      'Mikroteks bingkai dalam dan garis di bawah judul = hash kredensial lengkap, diulang.',
      `Penggaris masa berlaku: ${months} ruas bulan = ${C.validDays} hari; segitiga merah-cokelat = hari status dibaca.`,
      'Nomor seri merah-cokelat (ID kredensial) dicetak dua kali: badan piagam dan potongan periksa.',
      'Cap status melintasi perforasi: snapshot bertanggal; status terkini lewat QR di potongan periksa.'
    ],
    fonts: [{ role: 'Judul & label ukir', name: 'Cinzel' }, { role: 'Badan, nama, kelas, angka', name: 'Cormorant Garamond' }, { role: 'Hash & alamat', name: 'JetBrains Mono' }],
    palette: [
      { name: 'Kertas krem', hex: '#f4ecd8', use: 'badan piagam, bergradasi ke #efe6cf' },
      { name: 'Tinta hijau-batu', hex: '#1f3a36', use: 'judul, teks, garis rambut, pita, email takik' },
      { name: 'Hijau-batu muda', hex: '#2f4a45', use: 'guilloche, teks sekunder' },
      { name: 'Kuningan', hex: '#b08d3c', use: 'segel foil, pip komponen' },
      { name: 'Kuningan terang', hex: '#e3c878', use: 'kilau dan bevel segel' },
      { name: 'Tinta cap', hex: '#8a3a2c', use: 'cap status bertanggal, nomor seri' }
    ],
    motif: 'Cetak pengaman ala uang kertas: guilloche, mikroteks, nomor seri merah ganda, perforasi; segel foil kuningan bergerigi di atas pita = lencana.',
    motion: {
      entrance: 'Kertas turun dan mengendap; guilloche menggambar dirinya berlapis (bingkai → roset sudut → roset latar); teks naik berurutan; pita terurai dari tepi atas; segel menghantam; ekor pita jatuh; cap status menghantam terakhir.',
      continuous: 'Kilau foil menyapu segel tiap ±7,5 detik; ekor pita berayun sangat pelan (±0,8°).',
      interaction: 'Pantulan cahaya pada segel bergeser mengikuti penunjuk; segel bisa diklik atau ditekan (Enter/Spasi) untuk mengulang cap.',
      micro: `Segel menghantam (skala 1,42 → 0,955 → 1) dengan cincin benturan dan denyut bayangan; lalu ${C.score} garis ukur menyala berurutan selaras hitung-naik angka nilai.`
    },
    limits: [
      'Label baru (bukan klaim): "No." untuk ID kredensial, "NILAI" dan "dari 100" di medali segel, "bobot …%" pada pip, "per <tanggal>" pada cap, merek "Lencana" di potongan periksa, label aria "Potongan periksa", "Komponen nilai", dan label tombol segel.',
      'Cap "BERLAKU" adalah snapshot bertanggal (FMT.statusReadOn); TXT.statusNote tepat di bawahnya di potongan periksa mengarahkan ke QR untuk status terkini.',
      'Guilloche, mikroteks, dan nomor seri adalah ornamen turunan hash (sidik visual), bukan fitur pengaman; pemeriksaan tetap lewat QR dan tanda tangan.',
      'Tanda tangan ditulis sebagai nama agen dalam huruf miring biasa, bukan tiruan tanda tangan tangan; jenis bukti (DataIntegrityProof · eddsa-rdfc-2022) tercetak di bawah garisnya.',
