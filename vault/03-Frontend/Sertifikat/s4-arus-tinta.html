<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sertifikat · spesimen desain</title>
<!-- DESIGN:HEAD — tautan font (Google Fonts) dan <meta> khusus desain. Tanpa skrip eksternal, tanpa gambar eksternal. -->
<meta name="description" content="S4 · Arus Tinta — spesimen desain sertifikat Lencana: tiga pita bertekstur titik mengalir ke satu cap tinta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=JetBrains+Mono:wght@400;500&family=Mrs+Saint+Delafield&display=swap">
<!-- /DESIGN:HEAD -->
<style>
/* ===================== SHARED SHELL — JANGAN UBAH (identik di kelima desain) ===================== */
:root{
  --sheet-w:1122px; --sheet-h:793px;           /* A4 landscape pada 96 dpi, dikurangi sedikit supaya muat satu halaman cetak */
  --scale:1;
  --cx-bg:#e7e8ec; --cx-bar:#15171c; --cx-bar-ink:#e9eaee; --cx-bar-mute:#9aa0ab; --cx-accent:#f0b90b;
}
*{box-sizing:border-box}
html,body{margin:0}
body.cx{background:var(--cx-bg);color:#1b1d22;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.cx-bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--cx-bar);color:var(--cx-bar-ink)}
.cx-bar a{color:var(--cx-bar-ink);text-decoration:none;opacity:.8}
.cx-bar a:hover{opacity:1;text-decoration:underline}
.cx-bar .cx-title{font-weight:650;letter-spacing:.01em}
.cx-bar .cx-title small{display:block;font-weight:400;color:var(--cx-bar-mute);font-size:12px;letter-spacing:0}
.cx-bar .cx-sp{flex:1 1 auto}
.cx-seg{display:inline-flex;border:1px solid #3a3e48;border-radius:8px;overflow:hidden}
.cx-seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--cx-bar-mute)}
.cx-seg button[aria-pressed="true"]{background:var(--cx-accent);color:#15171c;font-weight:600}
.cx-seg button:focus-visible,.cx-btn:focus-visible{outline:2px solid var(--cx-accent);outline-offset:2px}
.cx-btn{all:unset;cursor:pointer;padding:6px 12px;border:1px solid #3a3e48;border-radius:8px;font-size:13px;color:var(--cx-bar-ink)}
.cx-btn:hover{border-color:var(--cx-accent)}
.cx-stage{display:grid;place-items:center;padding:20px 12px 8px}
.cx-fit{position:relative;width:calc(var(--sheet-w) * var(--scale));height:calc(var(--sheet-h) * var(--scale))}
.cx-scale{position:absolute;left:0;top:0;width:var(--sheet-w);height:var(--sheet-h);transform:scale(var(--scale));transform-origin:0 0}   /* satu pemilik transform: skala */
.cx-tilt{width:100%;height:100%;transform:perspective(1800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}   /* satu pemilik transform: miring (interaksi) */
.sheet{position:relative;width:var(--sheet-w);height:var(--sheet-h);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18),0 18px 50px rgba(20,22,30,.28);isolation:isolate}
.cx-foot{max-width:1122px;margin:10px auto 0;padding:0 16px;color:#5b616c;font-size:12.5px}
.cx-foot a{color:#2b4a9a}
.cx-notes{max-width:1122px;margin:18px auto 56px;padding:0 16px}
.cx-notes details{background:#fff;border:1px solid #d6d8de;border-radius:12px;padding:14px 18px}
.cx-notes summary{cursor:pointer;font-weight:650}
.cx-notes dl{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px 18px;margin:14px 0 0}
.cx-notes dt{color:#5b616c}
.cx-notes dd{margin:0}
.cx-notes ul{margin:0;padding-left:18px}
.cx-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
@media (max-width:640px){.cx-notes dl{grid-template-columns:1fr}.cx-notes dt{margin-top:8px}}

/* tampilan alamat ⇄ nama contoh: desain menandai elemen dengan data-show="alamat" atau data-show="nama" */
.sheet[data-mode="alamat"] [data-show="nama"],.sheet[data-mode="nama"] [data-show="alamat"]{display:none !important}

@page{size:297mm 210mm;margin:0}
@media print{
  html,body.cx{background:#fff !important;min-height:0}
  .cx-bar,.cx-foot,.cx-notes{display:none !important}
  .cx-stage{display:block;padding:0;place-items:normal;justify-items:normal;align-items:normal}
  .cx-fit{width:auto;height:auto;position:static;margin:0}
  .cx-scale{position:static;width:auto;height:auto;transform:none !important}
  .cx-tilt{transform:none !important;transition:none !important}
  .sheet{box-shadow:none !important;margin:0;break-inside:avoid;page-break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet,.sheet *{animation:none !important;transition:none !important}   /* cetak = keadaan akhir, bukan separuh jalan */
}
/* ===================== /SHARED SHELL ===================== */

/* ===================== DESIGN CSS ===================== */
/* ATURAN GERAK: keadaan AKHIR adalah gaya bawaan. Semua animasi (masuk dan berkelanjutan) hanya berlaku di bawah `.sheet.is-playing …`,
   dengan animation-fill-mode: both. Tanpa kelas itu (reduce-motion, ?motion=off, cetak) kertas tampil utuh dan diam. */
/* ---------- S4 · Arus Tinta — token ---------- */
.sheet{
  --paper:#efeadf; --paper-hi:#f7f3ea; --ink:#16303a; --ink-2:#27434b; --mute:#4b5d61;
  --t-deep:#17565c; --t-mid:#1f7a7d; --t-light:#5fa8a6; --t-pale:#b9dcd8;
  --terra:#ac4c2d; --terra-ink:#a3472a; --graphite:#4f585b;
  --f-display:"Fraunces","Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --f-body:"Alegreya","Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --f-script:"Mrs Saint Delafield","Segoe Script","Snell Roundhand","Apple Chancery",cursive;
  --f-mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.16,1,.3,1); --flow:cubic-bezier(.3,.1,.25,1); --sine:cubic-bezier(.37,0,.63,1);
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.4;
}
.sheet p,.sheet dl,.sheet dd,.sheet h1{margin:0}
.sheet .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- kertas ---------- */
.sheet .paper{position:absolute;left:0;top:0;z-index:0;display:block}

/* ---------- pita (lapisan dibangun JS) ---------- */
.sheet .art{position:absolute;inset:0;z-index:1;pointer-events:none}
.rl{position:absolute;inset:0;pointer-events:none;will-change:transform;transition:transform 1.3s cubic-bezier(.2,.8,.2,1),opacity .4s ease}
.rl>.sw{position:absolute;inset:0}
.rl svg{position:absolute;left:0;top:0;overflow:visible;display:block}
.rl .base{pointer-events:visiblePainted;cursor:default}
.rl.k{transform:translate3d(calc((var(--mx,50%) - 50%) * -.006),calc((var(--my,50%) - 50%) * -.009),0)}
.rl.e{transform:translate3d(calc((var(--mx,50%) - 50%) * -.011),calc((var(--my,50%) - 50%) * -.015),0)}
.rl.p{transform:translate3d(calc((var(--mx,50%) - 50%) * -.017),calc((var(--my,50%) - 50%) * -.023),0)}
.rl .gls{will-change:transform}
.rl .gl{fill:none;stroke-linecap:round;stroke-dashoffset:0}
.rv{fill:none;stroke:#fff;stroke-dasharray:100 112;stroke-dashoffset:0}
.sheet[data-hot] .rl{opacity:.55}
.sheet[data-hot="kuis"] .rl.k,.sheet[data-hot="esai"] .rl.e,.sheet[data-hot="praktik"] .rl.p{opacity:1}
.sheet[data-hot="kuis"] .rl.k .gl,.sheet[data-hot="esai"] .rl.e .gl,.sheet[data-hot="praktik"] .rl.p .gl{stroke-opacity:1}

/* ---------- label tangan ---------- */
.sheet .tags{position:absolute;inset:0;z-index:5;pointer-events:none}
.tag{all:unset;position:absolute;pointer-events:auto;cursor:default;white-space:nowrap;color:var(--ink);border-radius:6px;
  font:600 25px/1 var(--f-hand)}
.tag .tg-in{display:inline-block;padding:2px 4px}
.tag .tv{font:600 15px/1 var(--f-display);font-variant-numeric:tabular-nums lining-nums;letter-spacing:.02em;margin-left:5px;vertical-align:2px;color:var(--t-deep)}
.tag .tw{display:block;font:500 17px/1 var(--f-hand);color:var(--terra-ink);margin-top:1px}
.tag .ul{position:absolute;left:4px;right:4px;bottom:-2px;height:2px;border-radius:2px;background:var(--terra);transform:scaleX(0);transform-origin:0 50%;transition:transform .45s var(--out)}
.tag:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
.sheet[data-hot="kuis"] .tag.k .ul,.sheet[data-hot="esai"] .tag.e .ul,.sheet[data-hot="praktik"] .tag.p .ul{transform:scaleX(1)}
.tags .ld{fill:none;stroke:var(--ink);stroke-width:.9;stroke-linecap:round}
.tags .ld-dot{fill:var(--paper-hi);stroke:var(--ink);stroke-width:1}

/* ---------- cap tinta ---------- */
.seal{position:absolute;z-index:4;width:280px;height:280px}
.seal .disc-in{position:absolute;inset:0}
.seal-disc{position:absolute;left:0;top:0;overflow:visible}
.seal-halo{position:absolute;left:28px;top:28px;width:224px;height:224px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(172,76,45,0) 58%,rgba(172,76,45,.16) 80%,rgba(172,76,45,0) 100%);opacity:.9}
.seal-press{position:absolute;left:10px;top:10px;width:260px;height:260px}
.seal-rot{width:100%;height:100%;transform:rotate(var(--rest,-7deg))}
.stamp{display:block;overflow:visible;--logo-a:rgba(172,76,45,.55);--logo-b:#ac4c2d}
.stamp .ring-a{fill:none;stroke:var(--terra);stroke-width:5.2}
.stamp .ring-b{fill:none;stroke:var(--terra);stroke-width:1.3}
.stamp .ring-c{fill:none;stroke:var(--terra);stroke-width:1.2}
.stamp .ring-t{fill:var(--terra);font:700 18px/1 var(--f-display);letter-spacing:.2em;font-variation-settings:"SOFT" 40,"WONK" 0;font-variant-numeric:lining-nums}
.stamp .ring-dot{fill:var(--terra)}
.stamp .sc{fill:var(--terra);font:650 44px/1 var(--f-display);font-variant-numeric:tabular-nums lining-nums;text-anchor:middle;font-variation-settings:"SOFT" 60,"WONK" 0}
.stamp .bd{fill:var(--terra)}
.stamp .bd.off{fill:none;stroke:var(--terra);stroke-width:.9;opacity:.7}
.stamp .tick{stroke:var(--terra);stroke-width:2.3;stroke-linecap:round}
.splat{position:absolute;left:-60px;top:-60px;overflow:visible;pointer-events:none}
.splat .sp{fill:var(--terra);transform-box:fill-box;transform-origin:center}
.score-line{position:absolute;z-index:4;width:300px;text-align:center;font:italic 400 14px/1.3 var(--f-body);color:var(--ink-2)}

/* ---------- catatan tangan (kunci) ---------- */
.key{position:absolute;z-index:4;color:var(--terra-ink);font:500 20px/1.05 var(--f-hand);transform:rotate(-3deg);transform-origin:0 0}
.key span{display:block;white-space:nowrap}
.key .k2{font-size:19px;margin-top:2px}

/* ---------- judul ---------- */
.ttl{position:absolute;left:530px;top:50px;width:540px;z-index:3}
.ttl h1{font-weight:400}
.ttl .t1{display:block;font:620 56px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-variation-settings:"SOFT" 30,"WONK" 0}
.ttl .t2{display:block;margin-top:6px;font:italic 380 40px/1.05 var(--f-display);color:var(--t-deep);font-variation-settings:"SOFT" 100,"WONK" 1}

/* ---------- penerima ---------- */
.mid{position:absolute;left:530px;top:198px;width:540px;z-index:3}
.lbl{font:italic 400 18px/1.25 var(--f-body);color:var(--mute)}
.addr{position:relative;margin-top:6px}
.addr .ox{position:absolute;left:-30px;top:13px;font:italic 500 17px/1 var(--f-display);color:var(--t-deep)}
.addr .groups{display:block;font:italic 420 35px/1.27 var(--f-display);color:var(--ink);font-variant-numeric:lining-nums proportional-nums;letter-spacing:.012em;font-variation-settings:"SOFT" 50,"WONK" 0}
.addr .g{display:inline-block;margin-right:.36em}
.addr .br{display:block;height:0}
.nm-wrap{margin:0 0 0 -6px;height:84px;line-height:84px;white-space:nowrap}
.named .nm{display:inline-block;padding:0 14px 0 6px;font:400 var(--nm-size,74px)/1 var(--f-script);color:var(--ink);vertical-align:middle}
.nm-addr{margin-top:0;font:italic 420 19px/1.3 var(--f-display);color:var(--ink);font-variation-settings:"SOFT" 50,"WONK" 0;font-variant-numeric:lining-nums;white-space:nowrap}
.nm-addr .nm-k{font:italic 400 15px/1 var(--f-body);color:var(--mute);margin-right:4px}
.nm-note{margin-top:3px;max-width:540px;font:italic 400 13px/1.35 var(--f-body);color:var(--mute)}

/* ---------- kelas ---------- */
.crs{margin-top:20px;width:520px}
.course{margin-top:4px;font:520 29px/1.16 var(--f-display);color:var(--ink);font-variation-settings:"SOFT" 50,"WONK" 0;text-wrap:balance}

/* ---------- fakta ---------- */
.facts{position:absolute;left:530px;top:478px;width:318px;z-index:3;display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:10px}
.facts dt{font:500 11px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.facts .f-date dd{margin-top:3px}
.facts .hand{display:block;font:600 25px/1 var(--f-hand);color:var(--ink);white-space:nowrap}
.facts .time{display:block;font:400 12px/1.2 var(--f-body);color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.span365{position:absolute;left:532px;top:541px;width:318px;height:28px;z-index:3;pointer-events:none}
.span365 svg{position:absolute;left:0;top:0;overflow:visible}
.span365 .arrow{fill:none;stroke:var(--terra);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.span365 .days{position:absolute;left:116px;top:12px;padding:0 6px;background:var(--paper);font:500 18px/1 var(--f-hand);color:var(--terra-ink)}
.facts .f-pub{grid-column:1/-1;margin-top:26px}
.facts .f-sig{grid-column:1/-1}
.facts .pub{font:500 15px/1.25 var(--f-body);color:var(--ink)}
.facts .pub-note{font:italic 400 13.5px/1.25 var(--f-body);color:var(--mute)}
.facts .f-sig dd{position:relative}
.facts .hashbars{display:block;margin:2px 0 2px 0;overflow:visible}
.facts .hashbars .hb{stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;opacity:.82;transform-box:fill-box;transform-origin:50% 100%}
.facts .sig-line{display:block;border-top:1px solid rgba(22,48,58,.42);padding-top:4px;font:400 13.5px/1.3 var(--f-body);color:var(--ink-2)}
.facts .sig-line b{font-weight:700;color:var(--ink)}
.facts .proof{display:block;font:italic 400 12.5px/1.3 var(--f-body);color:var(--mute)}

/* ---------- slip periksa (QR) ---------- */
.slip{position:absolute;left:866px;top:452px;width:202px;height:268px;z-index:3;transform-origin:50% 0}
.slip-bg{position:absolute;left:0;top:0;overflow:visible}
.qr-plate{position:absolute;left:8px;top:9px;width:186px;height:186px;background:#fdfbf6;display:grid;place-items:center}
.qr-plate .qr{width:156px;height:156px;display:block;color:#0f2229}
.slip .host{position:absolute;left:8px;right:8px;top:202px;text-align:center;font:500 12px/1.2 var(--f-mono);color:var(--ink);letter-spacing:-.01em}
.slip .scan{position:absolute;left:14px;right:14px;top:221px;text-align:center;font:italic 400 13px/1.25 var(--f-body);color:var(--ink-2)}

/* ---------- kolofon id + kaki ---------- */
.ids{position:absolute;left:48px;top:724px;right:48px;z-index:3;display:flex;flex-wrap:wrap;gap:0 22px}
.ids>div{display:flex;gap:6px;align-items:baseline}
.ids dt{font:400 11px/1.4 var(--f-body);color:var(--mute)}
.ids dd{font:400 11px/1.4 var(--f-mono);color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.foot{position:absolute;left:48px;right:48px;top:744px;z-index:3;font:400 11.5px/1.42 var(--f-body);color:var(--mute)}
.foot .demo{font-weight:700;color:var(--ink-2)}
.foot .sep{color:var(--t-light)}
/* ==================== GERAK (hanya di bawah .is-playing; keadaan akhir = gaya bawaan) ==================== */
.sheet.is-playing .rv.k{animation:s4-reveal 1.75s var(--flow) 0s both}
.sheet.is-playing .rv.e{animation:s4-reveal 1.5s var(--flow) .18s both}
.sheet.is-playing .rv.p{animation:s4-reveal 1.62s var(--flow) .34s both}
@keyframes s4-reveal{from{stroke-dashoffset:104}to{stroke-dashoffset:0}}

.sheet.is-playing .sw.k{animation:s4-sway-k 14s var(--sine) 2s infinite both}
.sheet.is-playing .sw.e{animation:s4-sway-e 12s var(--sine) 2s infinite both}
.sheet.is-playing .sw.p{animation:s4-sway-p 16s var(--sine) 2s infinite both}
@keyframes s4-sway-k{0%,100%{transform:translate3d(0,0,0)}25%{transform:translate3d(3px,-2px,0)}50%{transform:translate3d(1px,-4px,0)}75%{transform:translate3d(-3px,-1px,0)}}
@keyframes s4-sway-e{0%,100%{transform:translate3d(0,0,0)}25%{transform:translate3d(-2px,3px,0)}50%{transform:translate3d(2px,4px,0)}75%{transform:translate3d(4px,1px,0)}}
@keyframes s4-sway-p{0%,100%{transform:translate3d(0,0,0)}25%{transform:translate3d(2px,4px,0)}50%{transform:translate3d(-3px,3px,0)}75%{transform:translate3d(-4px,-2px,0)}}

.sheet.is-playing .gl{animation:s4-glide 13s var(--sine) 2.2s infinite alternate both}
.sheet.is-playing .gl.g2{animation-duration:9.5s;animation-delay:2.6s}
@keyframes s4-glide{from{stroke-dashoffset:0}to{stroke-dashoffset:-96}}

.sheet.is-playing .tag .tg-in{animation:s4-pop .62s var(--spring) var(--d,1.2s) both}
.sheet.is-playing .tags .ld{animation:s4-draw .5s var(--out) var(--dl,1s) both}
.sheet.is-playing .tags .ld-dot{animation:s4-fade .3s ease-out var(--dl,1s) both}
@keyframes s4-pop{from{opacity:0;transform:translateY(7px) scale(.7) rotate(-7deg)}to{opacity:1;transform:none}}
@keyframes s4-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes s4-fade{from{opacity:0}to{opacity:1}}

.sheet.is-playing .disc-in{animation:s4-disc .8s var(--spring) 1.3s both}
@keyframes s4-disc{from{opacity:0;transform:scale(.86) rotate(-8deg)}to{opacity:1;transform:none}}
.sheet.is-playing .seal-disc{animation:s4-dip .5s var(--out) 2.12s both}
@keyframes s4-dip{0%{transform:scale(1)}30%{transform:scale(.982)}100%{transform:scale(1)}}
.sheet.is-playing .seal-press{animation:s4-press .62s cubic-bezier(.55,0,.85,.3) 1.92s both}
@keyframes s4-press{0%{opacity:0;transform:scale(1.55)}38%{opacity:.25}62%{opacity:1;transform:scale(.955);animation-timing-function:cubic-bezier(.2,.9,.3,1)}100%{opacity:1;transform:scale(1)}}
.sheet.is-playing .seal-rot{animation:s4-wobble 1.05s cubic-bezier(.3,.7,.4,1) 1.92s both}
@keyframes s4-wobble{0%{transform:rotate(calc(var(--rest,-7deg) - 10deg))}38%{transform:rotate(calc(var(--rest,-7deg) + 3deg))}58%{transform:rotate(calc(var(--rest,-7deg) - 2deg))}78%{transform:rotate(calc(var(--rest,-7deg) + .8deg))}100%{transform:rotate(var(--rest,-7deg))}}
.sheet.is-playing .seal-halo{animation:s4-halo 1.1s var(--out) 2.18s both}
@keyframes s4-halo{0%{opacity:0;transform:scale(.55)}45%{opacity:1;transform:scale(1.07)}100%{opacity:.9;transform:scale(1)}}
.sheet.is-playing .splat .sp{animation:s4-splat .5s var(--spring) calc(2.2s + var(--i,0) * 28ms) both}
@keyframes s4-splat{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.sheet.is-playing .beads .on{animation:s4-fade .22s ease-out calc(2.3s + var(--i,0) * 7ms) both}
.sheet.is-playing .score-line{animation:s4-rise .8s var(--out) 2.7s both}

.sheet.is-playing .ttl .t1{animation:s4-rise 1s var(--out) .1s both}
.sheet.is-playing .ttl .t2{animation:s4-rise 1s var(--out) .26s both}
.sheet.is-playing .rcp .lbl{animation:s4-rise .8s var(--out) .45s both}

.sheet.is-playing .hashbars .hb{animation:s4-bar .45s var(--spring) calc(1.35s + var(--i,0) * 22ms) both}

.sheet.is-playing .slip{animation:s4-slip .95s var(--spring) 1.15s both}
.sheet.is-playing .ids{animation:s4-rise .8s var(--out) 1.5s both}
.sheet.is-playing .key{animation:s4-key .7s var(--spring) 1.85s both}
.sheet.is-playing .foot{animation:s4-fade .9s ease-out 1.6s both}

@keyframes s4-ink{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes s4-write{from{clip-path:inset(-60% 100% -80% -40%)}to{clip-path:inset(-60% -40% -80% -40%)}}
@keyframes s4-slip{from{opacity:0;transform:translateY(22px) rotate(2.5deg)}to{opacity:1;transform:none}}
@keyframes s4-key{from{opacity:0;transform:rotate(-3deg) translateY(6px) scale(.9)}to{opacity:1;transform:rotate(-3deg)}}

  });

  /* ---------- debug: garis tengah + persilangan ---------- */
  if (DEBUG) {
    let d = svgOpen() + '<g fill="none" stroke-width="1">';
    RIBS.forEach((r) => { d += `<path d="${along(r.c, () => 0)}" stroke="#f0f"/>`; r.anchors.forEach((a) => { d += `<circle cx="${a.p[0]}" cy="${a.p[1]}" r="4" stroke="#f0f"/>`; }); });

    window.__s4 = { crosses, order: order.map((g) => g.id + ':' + g.z), counts: Object.keys(STIP).map((k) => k + ':' + (STIP[k].d1.length + STIP[k].d2.length + STIP[k].l1.length) / 2) };
  }

  document.addEventListener('cx:play', () => { hot(null); fitName(); });

  window.DESIGN = {

    tagline: 'tiga pita bertekstur titik — kuis, esai, praktik — mengalir dari tepi kiri, saling anyam, lalu terkumpul di bawah satu cap tinta yang ditekan tangan.',

      metaphor: 'Arus/anyaman: pita = komponen nilai, ketebalan = sumbangannya, cap = hasil yang dikunci; tepi kertas sobek = benda nyata yang bisa dipegang.'
    },
    encodes: [
      `Lebar pita = bobot × nilai × ${PX} px: kuis ${dec1(COMP.kuis.contrib)}, esai ${dec1(COMP.esai.contrib)}, praktik ${dec1(COMP.praktik.contrib)} poin.`,

    ],
