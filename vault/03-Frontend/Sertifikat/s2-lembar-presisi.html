<head>

<title>Sertifikat · spesimen desain</title>
<!-- DESIGN:HEAD — tautan font (Google Fonts) dan <meta> khusus desain. Tanpa skrip eksternal, tanpa gambar eksternal. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- /DESIGN:HEAD -->
<style>
/* ===================== SHARED SHELL — JANGAN UBAH (identik di kelima desain) ===================== */
:root{
  --sheet-w:1122px; --sheet-h:793px;           /* A4 landscape pada 96 dpi, dikurangi sedikit supaya muat satu halaman cetak */
  --scale:1;
  --cx-bg:#e7e8ec; --cx-bar:#15171c; --cx-bar-ink:#e9eaee; --cx-bar-mute:#9aa0ab; --cx-accent:#f0b90b;
}
*{box-sizing:border-box}
html,body{margin:0}
body.cx{background:var(--cx-bg);color:#1b1d22;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.cx-bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--cx-bar);color:var(--cx-bar-ink)}
.cx-bar a{color:var(--cx-bar-ink);text-decoration:none;opacity:.8}
.cx-bar a:hover{opacity:1;text-decoration:underline}
.cx-bar .cx-title{font-weight:650;letter-spacing:.01em}
.cx-bar .cx-title small{display:block;font-weight:400;color:var(--cx-bar-mute);font-size:12px;letter-spacing:0}
.cx-bar .cx-sp{flex:1 1 auto}
.cx-seg{display:inline-flex;border:1px solid #3a3e48;border-radius:8px;overflow:hidden}
.cx-seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--cx-bar-mute)}
.cx-seg button[aria-pressed="true"]{background:var(--cx-accent);color:#15171c;font-weight:600}
.cx-seg button:focus-visible,.cx-btn:focus-visible{outline:2px solid var(--cx-accent);outline-offset:2px}
.cx-btn{all:unset;cursor:pointer;padding:6px 12px;border:1px solid #3a3e48;border-radius:8px;font-size:13px;color:var(--cx-bar-ink)}
.cx-btn:hover{border-color:var(--cx-accent)}
.cx-stage{display:grid;place-items:center;padding:20px 12px 8px}
.cx-fit{position:relative;width:calc(var(--sheet-w) * var(--scale));height:calc(var(--sheet-h) * var(--scale))}
.cx-scale{position:absolute;left:0;top:0;width:var(--sheet-w);height:var(--sheet-h);transform:scale(var(--scale));transform-origin:0 0}   /* satu pemilik transform: skala */
.cx-tilt{width:100%;height:100%;transform:perspective(1800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}   /* satu pemilik transform: miring (interaksi) */
.sheet{position:relative;width:var(--sheet-w);height:var(--sheet-h);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18),0 18px 50px rgba(20,22,30,.28);isolation:isolate}
.cx-foot{max-width:1122px;margin:10px auto 0;padding:0 16px;color:#5b616c;font-size:12.5px}
.cx-foot a{color:#2b4a9a}
.cx-notes{max-width:1122px;margin:18px auto 56px;padding:0 16px}
.cx-notes details{background:#fff;border:1px solid #d6d8de;border-radius:12px;padding:14px 18px}
.cx-notes summary{cursor:pointer;font-weight:650}
.cx-notes dl{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px 18px;margin:14px 0 0}
.cx-notes dt{color:#5b616c}
.cx-notes dd{margin:0}
.cx-notes ul{margin:0;padding-left:18px}
.cx-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
@media (max-width:640px){.cx-notes dl{grid-template-columns:1fr}.cx-notes dt{margin-top:8px}}

/* tampilan alamat ⇄ nama contoh: desain menandai elemen dengan data-show="alamat" atau data-show="nama" */
.sheet[data-mode="alamat"] [data-show="nama"],.sheet[data-mode="nama"] [data-show="alamat"]{display:none !important}

@page{size:297mm 210mm;margin:0}
@media print{
  html,body.cx{background:#fff !important;min-height:0}
  .cx-bar,.cx-foot,.cx-notes{display:none !important}
  .cx-stage{display:block;padding:0;place-items:normal;justify-items:normal;align-items:normal}
  .cx-fit{width:auto;height:auto;position:static;margin:0}
  .cx-scale{position:static;width:auto;height:auto;transform:none !important}
  .cx-tilt{transform:none !important;transition:none !important}
  .sheet{box-shadow:none !important;margin:0;break-inside:avoid;page-break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet,.sheet *{animation:none !important;transition:none !important}   /* cetak = keadaan akhir, bukan separuh jalan */
}
/* ===================== /SHARED SHELL ===================== */

/* ===================== DESIGN CSS ===================== */
/* ATURAN GERAK: keadaan AKHIR adalah gaya bawaan. Semua animasi (masuk dan berkelanjutan) hanya berlaku di bawah `.sheet.is-playing …`,
   dengan animation-fill-mode: both. Tanpa kelas itu (reduce-motion, ?motion=off, cetak) kertas tampil utuh dan diam. */
/* S2 · Lembar Presisi — Swiss / Minimal.
   Grid: margin 53 px, 12 kolom × 70 px, jarak 16 px → kolom n mulai di x = 53 + 86·n (kanan = 1069).
   Skala nilai: 1 poin = 5 px → 0–100 = 500 px = tepat 6 kolom (k6–k11). Masa berlaku: 365 hari = 500 px, sumbu kiri yang sama (x 569). */
.sheet{
  --ink:#0b0e11; --mute:#5c636d; --soft:#8a919b; --tick:#a9afb7; --hair:#d5d9de; --box:#b9bfc7; --paper:#fff; --gold:#f0b90b;
  --logo-a:#f0b90b; --logo-b:#0b0e11;
  --f-sans:"Inter Tight","Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --e-out:cubic-bezier(.16,1,.3,1); --e-draw:cubic-bezier(.7,0,.2,1); --e-spring:cubic-bezier(.32,1.36,.52,1); --e-snap:cubic-bezier(.1,.9,.15,1);
  background:var(--paper); color:var(--ink); font-family:var(--f-sans); font-size:12px; line-height:1.3;
  font-variant-numeric:tabular-nums lining-nums; -webkit-font-smoothing:antialiased;
}
.sheet h1,.sheet p,.sheet dl,.sheet dd{margin:0}
.sheet code{font:inherit}
.sheet i{font-style:normal}
.s2-a{position:absolute}
.sheet .s2-mono{font-family:var(--f-mono);font-variant-ligatures:none;letter-spacing:0;white-space:nowrap}   /* token alamat/hash/ID tidak pernah dipatah */
.s2-cap{font-size:10.5px;line-height:14px;color:var(--mute)}
.s2-lab{font-size:11px;line-height:14px;font-weight:500;color:var(--mute)}
.s2-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.s2-hr{position:absolute;display:block;height:1px;background:var(--hair);transform-origin:0 50%}
.s2-hr1{left:53px;top:182px;width:1016px}
.s2-hr2{left:53px;top:304px;width:1016px}
.s2-hr3{left:53px;top:541px;width:788px}
.s2-hr4{left:53px;top:712px;width:788px}

/* garis emas atas + kepala */
.s2-rule{left:53px;top:36px;width:1016px;height:3px;background:var(--gold);transform-origin:0 50%}
.s2-brand{left:53px;top:52px;height:28px;display:flex;align-items:center;gap:9px}
.s2-logo{width:30px;height:28px;display:block}
.s2-word{font-size:17px;font-weight:650;letter-spacing:-.015em}
.s2-id{left:569px;top:52px;width:500px;height:28px;display:flex;align-items:center;gap:12px}
.s2-id .s2-mono{font-size:12px}
.s2-strip{width:158px;height:24px;display:block;fill:var(--ink);margin-left:auto}
.s2-strip .b{fill:var(--box)}

/* judul */
.s2-title{left:53px;top:96px}
.s2-title h1{font-size:46px;line-height:50px;font-weight:600;letter-spacing:-.03em}
.s2-sub{margin-top:8px;font-size:11px;line-height:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}

/* masa berlaku: 365 hari = 500 px (k6–k11, satu sumbu dengan skala nilai) */
.s2-valid{left:569px;top:96px;width:500px;height:78px}
.s2-status{position:absolute;left:0;top:0;font-size:11px;line-height:14px;color:var(--mute)}
.s2-status b{color:var(--ink);font-weight:700;letter-spacing:.12em;margin-right:6px}
.s2-days{position:absolute;right:0;top:0;font-size:11px;line-height:14px;color:var(--mute)}
.s2-days span{color:var(--ink);font-weight:600}
.s2-tl{position:absolute;left:0;top:26px;width:500px;height:12px}
.s2-tl-bar{position:absolute;left:0;top:5px;width:500px;height:2px;background:var(--ink);transform-origin:0 50%}
.s2-tl-svg{position:absolute;left:0;top:0;width:500px;height:12px;overflow:visible;fill:none}
.s2-tl-svg .m{stroke:var(--tick);stroke-width:1}
.s2-tl-svg .y{stroke:var(--ink);stroke-width:1}
.s2-tl-svg .c{stroke:var(--ink);stroke-width:1.5}
.s2-dot{position:absolute;left:var(--snap,0px);top:6px;width:0;height:0}
.s2-dot i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;box-sizing:border-box}
.s2-core{background:var(--gold);border:1.5px solid var(--ink)}
.s2-ring{border:1.5px solid var(--gold);opacity:0}
.s2-tl-from,.s2-tl-to{position:absolute;top:48px;display:flex;flex-direction:column}
.s2-tl-to{right:0;text-align:right;align-items:flex-end}
.s2-tl-v{font-size:12px;line-height:16px;font-weight:500;color:var(--ink)}

/* penerima: label di k0–k1, nilai mulai k2 (x 225) */
.s2-rec{left:53px;top:192px;width:1016px;height:64px}
.s2-rec>.s2-lab{position:absolute;left:0;top:21px}
.s2-addr{position:absolute;left:172px;top:4px;display:grid;grid-template-columns:repeat(10,70px);column-gap:16px;
  font-family:var(--f-mono);font-weight:500;font-size:28px;line-height:36px;letter-spacing:-.01em;font-variant-ligatures:none}
.s2-addr .g{display:block}
.s2-0x{position:absolute;right:calc(100% + 18px);top:0;color:var(--soft);font-weight:400}
.s2-addr-cap{position:absolute;left:172px;top:46px}
.s2-name{position:absolute;left:172px;top:-4px;font-size:40px;line-height:44px;font-weight:600;letter-spacing:-.028em;white-space:nowrap}
.s2-name-cap{position:absolute;left:172px;top:46px;display:flex;gap:10px;align-items:baseline;white-space:nowrap}
.s2-name-cap .s2-mono{font-size:11.5px;color:var(--ink)}

/* kelas */
.s2-course{left:53px;top:266px;width:1016px;height:30px}
.s2-course>.s2-lab{position:absolute;left:0;top:11px}
.s2-course-v{position:absolute;left:172px;top:0;font-size:22px;line-height:28px;font-weight:500;letter-spacing:-.012em;white-space:nowrap}
.s2-course-v .s2-mono{font-size:11px;font-weight:400;color:var(--mute);margin-left:14px}

/* hasil: angka besar k0–k3, keterangan k4–k5, instrumen k6–k11 */
.s2-res-lab{left:53px;top:318px}
.s2-num{left:44px;top:308px;font-size:250px;line-height:250px;font-weight:500;letter-spacing:-.05em;white-space:nowrap}
.s2-num-in,.s2-num-beat{display:block;transform-origin:18% 86%}
.s2-verdict{left:397px;top:462px;width:156px}
.s2-verdict .s2-cap{width:124px}
.s2-pass{display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.16em;margin-bottom:8px}
.s2-sq{display:block;width:10px;height:10px;background:var(--gold);box-shadow:inset 0 0 0 1.5px var(--ink)}

.s2-inst{left:569px;top:316px;width:500px;height:184px}
.s2-scale{position:absolute;left:0;top:4px;width:500px;height:92px}
.s2-scale i{position:absolute;display:block}
.s2-track{left:0;top:44px;width:500px;height:1px;background:var(--box)}
.s2-read{left:0;top:42px;height:3px;background:var(--ink);transform-origin:0 50%}
.s2-gold{top:30px;height:12px;background:var(--gold);transform-origin:0 50%}
.s2-ticks{position:absolute;left:0;top:46px;width:501px;height:10px;overflow:visible;fill:none}
.s2-ticks .mn{stroke:var(--tick)} .s2-ticks .md{stroke:var(--soft)} .s2-ticks .mj{stroke:var(--ink)}
.s2-labs span{position:absolute;top:60px;width:30px;margin-left:-15px;text-align:center;font-size:10.5px;line-height:14px;color:var(--mute)}
.s2-labs .is-pass{color:var(--ink);font-weight:700}
.s2-pass-cap{position:absolute;top:76px;width:80px;margin-left:-40px;text-align:center;font-size:10.5px;line-height:14px;color:var(--ink);white-space:nowrap}
.s2-scale .s2-notch{top:22px;width:1.5px;height:34px;margin-left:-.75px;background:var(--ink)}
.s2-margin{position:absolute;top:13px;width:60px;margin-left:-30px;text-align:center;font-size:11px;line-height:14px;font-weight:650;transition:opacity .2s ease}
.s2-mk{position:absolute;top:0;width:0;height:60px}
.s2-mk-move{position:absolute;left:0;top:0;width:0;height:60px}
.s2-scale .s2-needle{left:-1px;top:16px;width:2px;height:40px;background:var(--ink)}
.s2-head{position:absolute;left:-7px;top:3px;width:14px;height:12px;overflow:visible}
.s2-head path{fill:var(--gold);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.s2-scale .s2-proj{top:40px;height:7px;background:var(--ink);opacity:0;transition:opacity .2s ease}
.s2-proj b{position:absolute;left:50%;top:-40px;width:120px;margin-left:-60px;text-align:center;font-size:10.5px;line-height:14px;font-weight:600;white-space:nowrap}
.s2-scale .s2-proj.is-hl{opacity:1}
.sheet.has-hl .s2-margin{opacity:0}

/* tumpukan bobot: lebar ∝ bobot, isi emas ∝ nilai, panjang isi = sumbangan poin pada skala yang sama */
.s2-stack{position:absolute;left:0;top:106px;width:500px;height:78px}
.s2-seg{position:absolute;top:0;height:56px;outline:none;transition:opacity .25s ease}
.s2-seg:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.sheet.has-hl .s2-seg:not(.is-hl){opacity:.32}
.s2-seg-n{position:absolute;left:0;top:0;font-size:11px;line-height:14px;font-weight:650;white-space:nowrap}
.s2-seg-w{margin-left:6px;font-size:10.5px;line-height:14px;font-weight:400;color:var(--mute)}
.s2-seg-box{position:absolute;left:0;right:3px;top:20px;height:14px;box-shadow:inset 0 0 0 1px var(--box)}
.s2-seg-box i{position:absolute;display:block}
.s2-seg-fill{left:0;top:0;bottom:0;width:100%;background:var(--gold);transform:scaleX(var(--f,1));transform-origin:0 50%}
.s2-seg-end{top:-3px;bottom:-3px;left:calc(var(--f,1) * 100%);width:2px;margin-left:-2px;background:var(--ink)}
.s2-seg-t{position:absolute;left:0;top:40px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.s2-seg.is-hl .s2-seg-t{font-weight:700}
.s2-sum{position:absolute;right:0;top:60px;font-size:14px;line-height:18px;font-weight:650;white-space:nowrap}

/* kursor ukur (interaksi) */
.s2-xh{position:absolute;left:0;top:-4px;bottom:-2px;width:1px;background:rgba(11,14,17,.42);transform:translateX(var(--xh,0px));opacity:0;transition:opacity .15s ease;pointer-events:none}
.s2-xh b{position:absolute;left:4px;top:-3px;padding:0 3px;background:var(--paper);font:500 10px/13px var(--f-mono);color:var(--ink)}
.s2-inst.is-xh .s2-xh{opacity:1}

/* fakta (dl) k0–k8: tiga kolom 2-rentang + satu kolom 3-rentang; keterangan QR di slot terakhir; QR 45 modul × 4 px = 180 px, zona tenang 4 modul (16 px) → pelat 212 px */
.s2-facts{left:53px;top:553px;width:758px;display:grid;grid-template-columns:156px 156px 156px 242px;grid-template-rows:62px 48px;column-gap:16px;row-gap:12px}
.s2-facts dt{font-size:10.5px;line-height:14px;color:var(--mute)}
.s2-facts dd{margin-top:3px;font-size:12px;line-height:15px;font-weight:500}
.s2-facts dd small{display:block;margin-top:1px;font-size:10.5px;line-height:14px;font-weight:400;color:var(--mute)}
.s2-facts dd.s2-mono,.s2-facts small .s2-mono{font-size:11.5px;font-weight:400;color:var(--ink)}
.s2-facts small .s2-mono{font-size:10.5px}
.s2-check{left:569px;top:627px;width:242px}
.s2-check .s2-mono{display:block;margin-top:5px;font-size:10.5px;line-height:14px;color:var(--ink);white-space:nowrap}
.s2-qr{left:857px;top:541px;width:212px;height:212px;background:#fff;box-shadow:inset 0 0 0 1px var(--ink);display:grid;place-items:center}
.s2-qr svg{width:180px;height:180px;display:block;color:#0b0e11}

.s2-foot{left:53px;top:724px;width:788px;font-size:10.5px;line-height:14px;color:var(--mute)}
.s2-foot b{color:var(--ink);font-weight:600}

/* ---- GERAK: semua di bawah .sheet.is-playing; keadaan akhir = gaya bawaan ---- */
@keyframes s2-draw{from{transform:scaleX(0)}}
@keyframes s2-rise{from{opacity:0;transform:translateY(8px)}}
@keyframes s2-fade{from{opacity:0}}
@keyframes s2-sweep{from{transform:translateX(var(--sweep,0px))}}
@keyframes s2-beat{0%{transform:scale(1)}35%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes s2-pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes s2-pulse{0%{transform:scale(1);opacity:.8}70%,100%{transform:scale(3.2);opacity:0}}
.sheet.is-playing .s2-rule{animation:s2-draw .9s var(--e-draw) both}
.sheet.is-playing .s2-hr{animation:s2-draw .9s var(--e-draw) .25s both}
.sheet.is-playing .s2-brand{animation:s2-rise .6s var(--e-out) .12s both}
.sheet.is-playing .s2-id{animation:s2-rise .6s var(--e-out) .2s both}
.sheet.is-playing .s2-title{animation:s2-rise .7s var(--e-out) .22s both}
.sheet.is-playing .s2-status,.sheet.is-playing .s2-days{animation:s2-fade .5s ease-out .5s both}
.sheet.is-playing .s2-tl-bar{animation:s2-draw .8s var(--e-draw) .38s both}
.sheet.is-playing .s2-tl-svg{animation:s2-fade .4s ease-out .9s both}
.sheet.is-playing .s2-core{animation:s2-pop .5s var(--e-spring) 1.05s both}
.sheet.is-playing .s2-ring{animation:s2-pulse 2.6s cubic-bezier(.2,.7,.3,1) 2.3s infinite both}
.sheet.is-playing .s2-tl-from,.sheet.is-playing .s2-tl-to{animation:s2-rise .6s var(--e-out) .66s both}
.sheet.is-playing .s2-rec>.s2-lab,.sheet.is-playing .s2-course>.s2-lab,.sheet.is-playing .s2-res-lab{animation:s2-fade .5s ease-out .4s both}
.sheet.is-playing .s2-0x{animation:s2-fade .4s ease-out .4s both}
.sheet.is-playing .s2-addr .g{animation:s2-rise .5s var(--e-out) calc(.44s + var(--i) * 45ms) both}
.sheet.is-playing .s2-addr-cap,.sheet.is-playing .s2-name,.sheet.is-playing .s2-name-cap{animation:s2-rise .6s var(--e-out) .5s both}
/* alamat ⇄ nama: baris yang baru tampil langsung naik (tanpa menunggu jeda koreografi masuk) */
.sheet.is-playing.s2-swapped .s2-0x,.sheet.is-playing.s2-swapped .s2-addr-cap,.sheet.is-playing.s2-swapped .s2-name,.sheet.is-playing.s2-swapped .s2-name-cap{animation-delay:0s}
.sheet.is-playing.s2-swapped .s2-addr .g{animation-delay:calc(var(--i) * 28ms)}
.sheet.is-playing .s2-course-v{animation:s2-rise .6s var(--e-out) .56s both}
.sheet.is-playing .s2-num-in{animation:s2-rise .6s var(--e-out) .66s both}
.sheet.is-playing .s2-num-beat{animation:s2-beat .5s var(--e-out) 1.92s both}
.sheet.is-playing .s2-track,.sheet.is-playing .s2-ticks,.sheet.is-playing .s2-labs,.sheet.is-playing .s2-scale .s2-notch,.sheet.is-playing .s2-pass-cap{animation:s2-fade .5s ease-out .7s both}
.sheet.is-playing .s2-mk{animation:s2-fade .25s ease-out .9s both}

    hashShort:      () => mid(CERT.hash, 10, 8),
    uid:            () => CERT.uid,
    uidShort:       () => mid(CERT.uid, 10, 8),
    tx:             () => CERT.tx,
    txShort:        () => mid(CERT.tx, 10, 8),
    block:          () => CERT.block.toLocaleString('id-ID'),
    chain:          () => `${CERT.chain.name} (${CERT.chain.id})`,
    issuedDate:     () => idDate(CERT.issuedAt),
    issuedShort:    () => idShort(CERT.issuedAt),
    issuedNum:      () => idNum(CERT.issuedAt),
    issuedTime:     () => idTime(CERT.issuedAt),
    validUntilDate: () => idDate(CERT.validUntil),
    validUntilShort:() => idShort(CERT.validUntil),
    validUntilNum:  () => idNum(CERT.validUntil),
    statusReadOn:   () => idDate(CERT.statusReadOn + 'T00:00:00Z'),
    status:         () => CERT.statusLabel,
    proof:          () => `${CERT.proof.type} · ${CERT.proof.suite}`,
    format:         () => CERT.format,
    rubricRef:      () => CERT.rubricRef,
    verifyHost:     () => CERT.verifyHost,
    verifyUrl:      () => CERT.verifyUrl,
    verifyUrlShort: () => CERT.verifyHost + '/?q=' + CERT.hash.slice(0, 10) + '…#/verify'
  };
  window.FMT = FMT;
  const bind = (root = document) => {
    $$('[data-bind]', root).forEach((el) => { const f = FMT[el.dataset.bind]; if (f) el.textContent = f(); else console.warn('data-bind tidak dikenal:', el.dataset.bind); });
    $$('[data-txt]',  root).forEach((el) => { const v = TXT[el.dataset.txt]; if (v !== undefined) el.textContent = v; else console.warn('data-txt tidak dikenal:', el.dataset.txt); });
  };
  /* ---- QR dan logo: SVG inline dari data nyata. QR wajib di atas pelat terang dengan zona tenang ≥ 4 modul. ---- */
  const injectQR = (root = document) => $$('svg[data-qr]', root).forEach((svg) => {
    svg.setAttribute('viewBox', `0 0 ${CERT.qr.modules} ${CERT.qr.modules}`);
    svg.setAttribute('shape-rendering', 'crispEdges'); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Kode QR menuju halaman verifikasi kredensial ini');
    svg.innerHTML = `<path d="${CERT.qr.path}" fill="currentColor"/>`;
  });
  const injectLogo = (root = document) => $$('svg[data-logo]', root).forEach((svg) => {
    svg.setAttribute('viewBox', `0 0 ${CERT.logo.w} ${CERT.logo.h}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Lambang Lencana');
    svg.innerHTML = `<path d="${CERT.logo.gold}" fill="var(--logo-a,#f0b90b)"/><path d="${CERT.logo.black}" fill="var(--logo-b,#0b0e11)"/>`;
  });
  /* ---- Alat jejak-hash: geometri turunan hash kredensial (nilai sama → gambar sama; kredensial lain → gambar lain). ---- */
  const BYTES = Uint8Array.from(CERT.hash.slice(2).match(/../g).map((h) => parseInt(h, 16)));
  const HASHART = {
    bytes: BYTES,
    byteAt: (i) => BYTES[((i % 32) + 32) % 32],
    /** PRNG deterministik (mulberry32) bibitnya diambil dari 4 byte hash mulai offset `from`. */
    rng: (from = 0) => { let a = ((BYTES[from % 32] << 24) | (BYTES[(from + 1) % 32] << 16) | (BYTES[(from + 2) % 32] << 8) | BYTES[(from + 3) % 32]) >>> 0;
      return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  };
  window.HASHART = HASHART;
  /** Hitung-naik angka (untuk gerak masuk); `ease` = fungsi 0..1 → 0..1. Menulis hasil akhir persis (bukan pembulatan bergerak). */
  window.countUp = (el, to, { ms = 1100, ease = (t) => 1 - Math.pow(1 - t, 3), from = 0, fmt = (v) => String(Math.round(v)) } = {}) => {
    const t0 = performance.now(); const tick = (now) => { const k = Math.min(1, (now - t0) / ms); el.textContent = fmt(from + (to - from) * ease(k)); if (k < 1) requestAnimationFrame(tick); else el.textContent = fmt(to); }; requestAnimationFrame(tick);
  };

  /* ---- Skala ke layar, miring (interaksi), gerak, cetak ---- */
  const root = document.documentElement, sheet = $('.sheet'), tilt = $('.cx-tilt'), fitBox = $('.cx-fit'), bar = $('.cx-bar');
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]motion=off/.test(location.search);
  const fit = () => { const w = innerWidth - 24, h = innerHeight - (bar ? bar.offsetHeight : 0) - 56; root.style.setProperty('--scale', Math.max(0.25, Math.min(w / 1122, h / 793, 1.6)).toFixed(4)); };
  addEventListener('resize', fit); fit();
  const play = () => { sheet.classList.remove('is-playing'); void sheet.offsetWidth; const r = reduced(); if (!r) sheet.classList.add('is-playing'); document.dispatchEvent(new CustomEvent('cx:play', { detail: { reduced: r } })); };
  window.cxPlay = play;
  fitBox.addEventListener('pointermove', (e) => {
    if (reduced() || e.pointerType === 'touch') return; const r = fitBox.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    tilt.style.setProperty('--ry', ((x - .5) * 5).toFixed(2) + 'deg'); tilt.style.setProperty('--rx', ((.5 - y) * 3.6).toFixed(2) + 'deg');
    sheet.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); sheet.style.setProperty('--my', (y * 100).toFixed(1) + '%');
  });
  fitBox.addEventListener('pointerleave', () => { tilt.style.setProperty('--ry', '0deg'); tilt.style.setProperty('--rx', '0deg'); sheet.style.setProperty('--mx', '50%'); sheet.style.setProperty('--my', '50%'); });
  $$('[data-mode-btn]').forEach((b) => b.addEventListener('click', () => { sheet.dataset.mode = b.dataset.modeBtn; $$('[data-mode-btn]').forEach((o) => o.setAttribute('aria-pressed', String(o === b))); }));
  $('[data-act="replay"]').addEventListener('click', play);
  $('[data-act="print"]').addEventListener('click', () => window.print());
  addEventListener('beforeprint', () => sheet.classList.remove('is-playing'));
  addEventListener('afterprint', () => { sheet.classList.add('is-playing'); });

  /* ---- Catatan desain (dari window.DESIGN yang diisi DESIGN:JS) ---- */
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const renderNotes = () => {
    const D = window.DESIGN; if (!D) return;
    document.title = `Sertifikat · ${D.id} ${D.name} (spesimen desain)`;
    $$('[data-design="title"]').forEach((e) => { e.textContent = `${D.id} · ${D.name}`; });
    $$('[data-design="row"]').forEach((e) => { e.textContent = D.row; });
    const li = (a) => '<ul>' + (a || []).map((x) => `<li>${esc(x)}</li>`).join('') + '</ul>';
    const sw = (D.palette || []).map((c) => `<span><i class="cx-sw" style="background:${esc(c.hex)}"></i>${esc(c.name)} <code>${esc(c.hex)}</code>${c.use ? ' — ' + esc(c.use) : ''}</span>`).join('<br>');
    $('[data-design="notes"]').innerHTML = `<dl>
      <dt>Estetika (doktrin §7)</dt><dd>${esc(D.row)} — ${esc(D.tagline || '')}</dd>
      <dt>Proses yang diwakili</dt><dd>${esc(D.brief.process)}</dd>
      <dt>Objek inti</dt><dd>${esc(D.brief.core)}</dd>
      <dt>Metafora ruang</dt><dd>${esc(D.brief.metaphor)}</dd>
      <dt>Geometri mengodekan</dt><dd>${li(D.encodes)}</dd>
      <dt>Tipografi</dt><dd>${(D.fonts || []).map((f) => `${esc(f.role)}: <b>${esc(f.name)}</b>`).join(' · ')}</dd>
      <dt>Palet</dt><dd>${sw}</dd>
      <dt>Motif</dt><dd>${esc(D.motif)}</dd>
      <dt>Gerak</dt><dd>${li([`Masuk: ${D.motion.entrance}`, `Berkelanjutan: ${D.motion.continuous}`, `Interaksi: ${D.motion.interaction}`, `Micro-beat: ${D.motion.micro}`])}</dd>
      <dt>Batas dan catatan klaim</dt><dd>${li(D.limits)}</dd>
    </dl>`;
  };

  const init = () => { bind(); injectQR(); injectLogo(); renderNotes(); fit();
    const go = () => { play(); }; (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve()).then(go); };
  window.__cxInit = init;   // DESIGN:JS memanggil __cxInit() SETELAH window.DESIGN dan handler 'cx:play' terpasang
})();
/* ===================== /SHARED SHELL JS ===================== */
</script>
<script>
/* ===================== DESIGN JS ===================== */
/* 1) window.DESIGN = { id, name, row, tagline, brief:{process,core,relationship,metaphor}, encodes:[…], fonts:[{role,name}], palette:[{name,hex,use}], motif, motion:{entrance,continuous,interaction,micro}, limits:[…] }
   2) document.addEventListener('cx:play', (e) => { … hitung-naik, micro-beat … }) — e.detail.reduced === true → langsung tulis nilai akhir tanpa gerak
   3) window.__cxInit()   ← terakhir */
(() => {
  'use strict';
  const C = window.CERT, F = window.FMT, H = window.HASHART, T = window.TXT;
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const sheet = $('.sheet');
  const U = 5;                                   // 1 poin = 5 px → skala 0–100 = 500 px = tepat 6 kolom grid
  const TW = 500;                                // garis masa berlaku (k6–k11): 365 hari = 500 px
  const px = (v) => (v * U) + 'px';
  const dec = (v) => v.toFixed(1).replace('.', ',');
  const comps = C.components.map((c) => ({ ...c, name: T[c.key] || c.label, pts: c.score * c.weight / 100 }));
  const sum = comps.reduce((a, c) => a + c.pts, 0);
  sheet.style.setProperty('--sweep', (-C.score * U) + 'px');

  /* 1) alamat dompet: 10 blok × 4 karakter, satu blok per kolom grid k2–k11 */
  $('.s2-addr').insertAdjacentHTML('beforeend', F.addressGroups().split(' ').map((g, i) => `<span class="g" aria-hidden="true" style="--i:${i}">${g}</span>`).join(''));

  /* 2) jejak hash: 32 batang = 32 byte hash kredensial, tinggi ∝ nilai byte */
  $('.s2-strip').innerHTML = Array.from(H.bytes, (b, i) => { const h = 2 + Math.round(b / 255 * 20); return `<rect x="${i * 5}" y="${22 - h}" width="3" height="${h}"/>`; }).join('') + '<rect class="b" x="0" y="23" width="158" height="1"/>';

  /* 3) skala 0–100: takik tiap poin, sedang tiap 5, utama tiap 10 */
  const d = { mn: '', md: '', mj: '' };
  for (let i = 0; i <= 100; i++) { const k = i % 10 === 0 ? 'mj' : i % 5 === 0 ? 'md' : 'mn'; d[k] += `M${i * U + .5} 0v${k === 'mj' ? 10 : k === 'md' ? 6 : 3}`; }
  $('.s2-ticks').innerHTML = Object.keys(d).map((k) => `<path class="${k}" d="${d[k]}"/>`).join('');
  let labs = ''; for (let i = 0; i <= 100; i += 10) labs += `<span${i === C.passMark ? ' class="is-pass"' : ''} style="left:${px(i)}">${i}</span>`;
  if (C.passMark % 10) labs += `<span class="is-pass" style="left:${px(C.passMark)}">${C.passMark}</span>`;
  $('.s2-labs').innerHTML = labs;
  $('.s2-notch').style.left = px(C.passMark);
  $('.s2-pass-cap').style.left = px(C.passMark);
  Object.assign($('.s2-gold').style, { left: px(C.passMark), width: px(C.score - C.passMark) });
  $('.s2-read').style.width = px(C.score);
  $('.s2-mk').style.left = px(C.score);
  const mg = $('.s2-margin'); mg.textContent = '+' + (C.score - C.passMark); mg.style.left = px((C.score + C.passMark) / 2);
  let acc = 0;
  $('.s2-projs').innerHTML = comps.map((c) => { const a = acc; acc += c.pts; return `<i class="s2-proj" data-k="${c.key}" style="left:${px(a)};width:${px(c.pts)}"><b>${c.name} ${dec(c.pts)}</b></i>`; }).join('');

  /* 4) tumpukan bobot: lebar ∝ bobot, isi ∝ nilai (panjang isi = sumbangan poin pada skala yang sama) */
  let wa = 0;
  $('.s2-stack').innerHTML = comps.map((c, i) => { const left = wa * U; wa += c.weight;
    return `<div class="s2-seg" data-k="${c.key}" tabindex="0" style="left:${left}px;width:${c.weight * U}px;--f:${c.score / 100};--d:${i}" aria-label="${c.name}: nilai ${c.score}, bobot ${c.weight}%, menyumbang ${dec(c.pts)} poin">`
      + `<span class="s2-seg-n">${c.name}<span class="s2-seg-w">${c.score} × ${c.weight}%</span></span>`
      + `<span class="s2-seg-box"><i class="s2-seg-fill"></i><i class="s2-seg-end"></i></span>`
      + `<span class="s2-seg-t">${i ? '+ ' : ''}${dec(c.pts)}</span></div>`; }).join('')
    + `<p class="s2-sum">= ${dec(sum)} → ${C.score}</p>`;

  /* 5) masa berlaku: 365 hari = 414 px; takik tiap awal bulan (WIB), takik tinggi di pergantian tahun */
  const WIB = 7 * 3600e3, t0 = Date.parse(C.issuedAt), t1 = Date.parse(C.validUntil), w0 = new Date(t0 + WIB);
  let mt = '', yt = '';
  for (let k = 1; k <= 13; k++) {
    const t = Date.UTC(w0.getUTCFullYear(), w0.getUTCMonth() + k, 1) - WIB; if (t >= t1) break;
    const x = ((t - t0) / (t1 - t0) * TW).toFixed(1);
    if (new Date(t + WIB).getUTCMonth() === 0) yt += `M${x} 0v12`; else mt += `M${x} 7v5`;
  }
  $('.s2-tl-svg').innerHTML = `<path class="m" d="${mt}"/><path class="y" d="${yt}"/><path class="c" d="M.75 0v12M${TW - .75} 0v12"/>`;
  const snapDay = Math.round((Date.parse(C.statusReadOn + 'T00:00:00Z') - Date.parse(C.issuedAt.slice(0, 10) + 'T00:00:00Z')) / 864e5);
  sheet.style.setProperty('--snap', (Math.max(0, Math.min(1, snapDay / C.validDays)) * TW).toFixed(1) + 'px');
  $('[data-days]').textContent = String(C.validDays);
  $$('[data-proof]').forEach((el) => { el.textContent = C.proof[el.dataset.proof]; });
  $$('[data-chain]').forEach((el) => { el.textContent = String(C.chain[el.dataset.chain]); });

  /* 6) interaksi: sorot/fokus komponen → sumbangannya menyala di skala; kursor ukur di atas instrumen */
  const segs = $$('.s2-seg'), projs = $$('.s2-proj');
  const hl = (k) => { sheet.classList.toggle('has-hl', !!k); segs.forEach((s) => s.classList.toggle('is-hl', s.dataset.k === k)); projs.forEach((p) => p.classList.toggle('is-hl', p.dataset.k === k)); };
  segs.forEach((s) => { const on = () => hl(s.dataset.k), off = () => hl(null);
    s.addEventListener('pointerenter', on); s.addEventListener('pointerleave', off); s.addEventListener('focus', on); s.addEventListener('blur', off); });
  const inst = $('.s2-inst'), xh = $('.s2-xh'), xhv = $('.s2-xh b');
  inst.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    const r = inst.getBoundingClientRect(), k = (e.clientX - r.left) / r.width;
    if (k < 0 || k > 1) { inst.classList.remove('is-xh'); return; }
    xh.style.setProperty('--xh', (k * 500).toFixed(1) + 'px'); xhv.textContent = String(Math.round(k * 100)); inst.classList.add('is-xh');
  });
  inst.addEventListener('pointerleave', () => inst.classList.remove('is-xh'));

  window.DESIGN = {
    id: 'S2', name: 'Lembar Presisi', row: 'Swiss / Minimal',
    tagline: 'sertifikat sebagai lembar spesifikasi — satu hasil diukur dengan presisi di atas grid 12 kolom; tinta di kertas putih, satu aksen emas Lencana.',
    brief: {
      process: 'Tiga komponen dinilai dan dibobot, dijumlahkan, lalu dibandingkan dengan batas lulus; kredensial ditandatangani agen penerbit, bukti penerbitannya tercatat di BNB Smart Chain testnet (97), dan siapa pun dapat memeriksanya lewat QR.',
      core: 'Pembacaan alat ukur: jarum yang berhenti di 87 pada skala 0–100, melewati takik batas lulus 60.',
      relationship: 'Kuis + esai + praktik (lebar = bobot, isi = nilai) → 86,9 → dibulatkan 87 → jarum melewati 60; diterbitkan → berlaku 365 hari → status dibaca pada satu tanggal.',
      metaphor: 'Lembar spesifikasi / instrumen ukur: sumbu skala + tumpukan berstrata + garis waktu, semuanya terkunci ke grid 12 kolom.'
    },
    encodes: [
      'Angka 87 (Inter Tight 250 px, angka tabular) = CERT.score; dihitung naik selama jarum menyapu.',
      'Skala 0–100: 1 poin = 5 px (6 kolom grid = 500 px); takik tinta + label di 60 = batas lulus (CERT.passMark); jarum emas-bertepi-tinta di 87.',
      'Pita emas 60→87 = selisih di atas batas lulus, diberi label "+27" sehingga tidak bergantung pada warna.',
      'Tumpukan bobot: lebar kotak ∝ bobot 50/30/20; isi emas ∝ nilai 75/98/100; panjang isi dalam px = sumbangan poin (37,5 / 29,4 / 20,0) pada skala yang sama → 86,9, dibulatkan 87 (web/src/score.ts:132). Ujung isi ditandai garis tinta.',
      'Sorot atau fokus (Tab) satu komponen → rentang sumbangannya menyala di garis baca skala (0–37,5 · 37,5–66,9 · 66,9–86,9).',
      'Garis masa berlaku: 500 px = 365 hari (CERT.validDays), mulai di sumbu kolom yang sama dengan skala nilai; takik tiap awal bulan WIB, takik tinggi di pergantian tahun; titik emas = tanggal status dibaca (CERT.statusReadOn).',
      'Jejak hash: 32 batang = 32 byte hash kredensial (HASHART.bytes), tinggi ∝ nilai byte — kredensial lain menghasilkan profil lain.',
      'Alamat dompet: 10 blok × 4 karakter, satu blok tepat satu kolom grid (k2–k11); "0x" menggantung di kolom label.'
    ],
    fonts: [{ role: 'Judul, teks, angka tabular', name: 'Inter Tight' }, { role: 'Alamat, hash, ID', name: 'JetBrains Mono' }],
    palette: [
      { name: 'Tinta', hex: '#0b0e11', use: 'teks, jarum, takik, garis baca' },
      { name: 'Emas Lencana', hex: '#f0b90b', use: 'satu-satunya aksen: garis atas, isi nilai, selisih di atas batas, titik status (tidak pernah untuk teks kecil)' },
      { name: 'Kertas', hex: '#ffffff', use: 'permukaan' },
      { name: 'Abu keterangan', hex: '#5c636d', use: 'label kecil (di atas ambang 4,5:1 di putih)' },
      { name: 'Garis rambut', hex: '#d5d9de', use: 'pemisah bagian' },
      { name: 'Kotak bobot', hex: '#b9bfc7', use: 'kapasitas bobot, alas skala' }
    ],
    motif: 'Garis rambut yang selalu berupa ukuran: takik skala, kotak bobot, takik bulan masa berlaku, batang byte hash. Tanpa bayangan, tanpa gradasi, tanpa ornamen kosong.',
    motion: {
      entrance: 'Garis emas atas tergambar kiri→kanan; kepala dan judul naik 8 px; blok alamat muncul berurutan; garis masa berlaku tergambar; tiga isi bobot terisi kiri→kanan bertahap; jarum menyapu 0→87 dengan pegas (lewat sedikit lalu mengendap) sementara angka dihitung naik; fakta naik 8 px bertahap.',
      continuous: 'Hanya satu: cincin di titik tanggal-baca status berdenyut pelan.',
      interaction: 'Sorot/fokus komponen → komponen lain meredup, rentang sumbangannya menyala di skala; kursor di atas instrumen → garis rambut ukur dengan bacaan 0–100; kemiringan lembar dari cangkang.',
      micro: 'Saat jarum mendarat: pita emas 60→87 "mengunci" (scaleX cepat, ease-out tajam) dan angka 87 berdetak sekali 1,03→1.'
    },
    limits: [
      'Kata/label baru (bukan dari TXT): "per <tanggal>" pada status, "hari", "batas lulus", "Skema tanda tangan", "Format", "Jaringan", label aria komponen "<Komponen>: nilai …, bobot …%, menyumbang … poin". Semuanya deskriptif; tidak ada klaim dari daftar terlarang.',
      'BERLAKU selalu tampil sebagai cuplikan bertanggal ("per 5 Oktober 2026") dan diikuti TXT.statusNote yang mengarah ke QR untuk status terkini.',
      'Angka turunan dihitung di JS dari CERT, tidak diketik: +27 (87 − 60), 37,5 / 29,4 / 20,0, 86,9 → 87.',
      'Skala menunjukkan nilai terhadap batas lulus, bukan peringkat terhadap peserta lain. Bacaan kursor hanya alat baca posisi, bukan data kredensial.',
      'Mode nama memakai nama contoh fiktif yang tidak ikut tanda tangan; alamat pendek dan TXT.nameNote tetap tampil.'
    ]
  };

  $$('[data-mode-btn]').forEach((b) => b.addEventListener('click', () => sheet.classList.add('s2-swapped')));
  let tm = 0;
  document.addEventListener('cx:play', (e) => {
    const el = $('.s2-87'); clearTimeout(tm); sheet.classList.remove('s2-swapped');
    if (e.detail && e.detail.reduced) { el.textContent = F.score(); return; }
    el.textContent = '0';
    tm = setTimeout(() => window.countUp(el, C.score, { ms: 1000, ease: (t) => 1 - Math.pow(1 - t, 3) }), 950);
  });

  window.__cxInit();
})();
/* ===================== /DESIGN JS ===================== */
</script>
